# Recursive resolver for the MTA's blocklist lookups (DNSBL_RESOLVER).
#
# Spamhaus refuses its public mirror to queries relayed by shared resolvers
# (the hosting provider's, 1.1.1.1, 8.8.8.8). This resolver asks the root and
# authoritative servers itself, so lookups leave from this server's own address.
# It forwards nothing and validates nothing: blocklist zones are unsigned, and a
# forwarder would reintroduce the shared resolver this exists to avoid.
server:
	interface: 0.0.0.0
	port: 5335
	do-ip4: yes
	# Most container networks have no IPv6 egress; asking v6 name servers would
	# only add timeouts.
	do-ip6: no
	do-udp: yes
	do-tcp: yes

	# Reachable only from the compose network, never as an open resolver.
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: 10.0.0.0/8 allow
	access-control: 172.16.0.0/12 allow
	access-control: 192.168.0.0/16 allow

	# Runs unprivileged in the foreground; nothing to drop, nothing to write.
	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	do-daemonize: no
	use-syslog: no
	logfile: ""
	verbosity: 0

	module-config: "iterator"
	qname-minimisation: yes
	harden-glue: yes
	hide-identity: yes
	hide-version: yes

	num-threads: 1
	msg-cache-size: 4m
	rrset-cache-size: 8m

# Local-only control socket, used by the container healthcheck.
remote-control:
	control-enable: yes
	control-interface: 127.0.0.1
	control-use-cert: no
