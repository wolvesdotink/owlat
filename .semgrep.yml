rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Webhook handlers that read a signature header and never pass it to a
  # verifier. Catches future regressions of the C2 unverified-signature
  # class.
  #
  # This is a syntactic guardrail, not a proof. It checks that the header
  # value reaches a verifier call. It does not check how the verdict is
  # used beyond three direct bad forms, and it cannot show that the
  # verdict decides whether the request is accepted.
  #
  # Reported: a `$X.get('...')` or `$X['...']` read whose quoted string
  # literal name contains "signature" (case-insensitive), followed by an
  # `if` or a ternary that tests it (`if (!sig)`, `if (sig)`,
  # `sig !== null ? ...`), unless the enclosing function's own body passes
  # the header value, or a value derived from it, to a verifier: a
  # `verify*` function or method (verifyGithubSignature,
  # verifyTwilioRequest, verifyMetaSignature, verifySvixHeaders,
  # crypto.subtle.verify, ...) or a synchronous compare (constantTimeEqual,
  # secretMatches, timingSafeEqual, Node's crypto.verify).
  #
  # A verifier call does not exempt the read in these direct forms only:
  #   (a) its result is assigned straight to a `const` that nothing in
  #       that block reads;
  #   (b) a known-async verifier (the named webhook helpers and
  #       crypto.subtle.verify), unawaited, is used directly as an `if`
  #       condition, a ternary test, or a `!` / `&&` / `||` operand;
  #   (c) it sits only in a function declared or bound to a `const` that
  #       is never referenced.
  # Every other use of the call counts as using the verdict.
  #
  # Known limits. Each is a `todoruleid` (missed) or `todook` (wrongly
  # reported) case in the test file:
  #   - How the verdict is used is not analysed beyond (a)-(c). Discarded
  #     results (a bare statement, `void`, parenthesised, chained, a
  #     comment between `await` and the call), transformed verdicts
  #     (`!`, `Boolean()`, any wrapper) that are then unread, wrapped
  #     conditions (`if (Boolean(verifyX(sig)))`), a verdict stored in a
  #     `let`/`var` or a destructured `Promise.all` and never read, an
  #     unawaited verifier stored and then tested, and a verifier only in
  #     a callback that never runs, are not detected.
  #   - What the verdict controls is not analysed: an `if` on it whose
  #     body is empty or only logs, both branches accepting, a verdict
  #     overwritten before it is read, a `try` whose `catch` swallows the
  #     error, and a verification in only one branch are not detected.
  #   - What is compared is not analysed: the signature compared with
  #     itself or with a literal is not detected.
  #   - Header names: only quoted string literals are recognised. A name
  #     in a constant, a template literal, or a literal written with
  #     escapes (`'x-\u0073ignature'`) is not detected.
  #   - The rule looks at one function: a header value passed to another
  #     function that verifies it is reported.
  #
  # Tests: .semgrep/tests/webhook-signature-presence-only.ts, run with
  # `semgrep --test --config .semgrep.yml <that file>` (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-presence-only
    severity: ERROR
    languages: [typescript]
    message: |
      This handler reads a signature header and tests it, but the header
      value never reaches a verifier call (or only in a form whose result
      is plainly unused). Pass it to one of the existing verification
      helpers (webhooks/adapters/resend.ts verifySvixHeaders,
      webhooks/adapters/twilio.ts verifyTwilioRequest,
      webhooks/adapters/meta.ts verifyMetaSignature, or the constant-time
      compare in lib/crypto.ts, constantTimeEqual / secretMatches), await
      it, and reject the request when it fails. This is a syntactic check:
      it confirms a verifier is called on the header, not that its verdict
      controls acceptance.
    options:
      # `<... $SIG ...>` also matches a value derived from the header, e.g.
      # `const provided = signature.slice(7)`.
      symbolic_propagation: true
    patterns:
      # Cheap gate first: a file that never says "signature" cannot hold a
      # matching header read, and skipping it keeps the rule fast (the
      # exemptions below scan every function body).
      - pattern-inside:
          pattern-regex: '(?i)\A(?=[\s\S]*signature)[\s\S]*\z'
      - pattern-either:
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
      - metavariable-regex:
          metavariable: $HEADER
          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
      # Exempt when the enclosing function's own body passes the header
      # value to a verify* call, unless that call is in one of the bad forms.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  # The innermost statement holding the call.
                  - pattern: |
                      <... $VERIFY(..., <... $SIG ...>, ...) ...>;
                  - metavariable-regex:
                      metavariable: $VERIFY
                      regex: ^([\w$]+\.)*verify\w*$
                  # (a) the verdict goes into a `const` that nothing in its
                  # block reads, before or after.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                const $VERDICT = $VERIFY(...);
                            - pattern: |
                                const $VERDICT = await $VERIFY(...);
                        - pattern-not-inside: |
                            const $VERDICT = $VALUE;
                            ...
                            <... $VERDICT ...>;
                        - pattern-not-inside: |
                            <... $VERDICT ...>;
                            ...
                            const $VERDICT = $VALUE;
                  # (c) the call sits in a function that is declared or bound
                  # to a `const` and never referenced.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                const $UNUSED = (...) => $ARROWBODY;
                            - pattern: |
                                const $UNUSED = function (...) { ... };
                            - pattern: |
                                function $UNUSED(...) { ... }
                        - pattern-not-inside: |
                            const $UNUSED = $DEFINITION;
                            ...
                            <... $UNUSED ...>;
                        - pattern-not-inside: |
                            <... $UNUSED ...>;
                            ...
                            const $UNUSED = $DEFINITION;
                        - pattern-not-inside: |
                            function $UNUSED(...) { ... }
                            ...
                            <... $UNUSED ...>;
                        - pattern-not-inside: |
                            <... $UNUSED ...>;
                            ...
                            function $UNUSED(...) { ... }
                  # (b) a known-async verifier, unawaited, used directly as a
                  # truth value (a Promise is always truthy). Only the named
                  # async helpers: the repo also has synchronous verify*
                  # functions, for which this form is correct.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                if ($VERIFY(...)) $BRANCH
                            - pattern: |
                                <... !$VERIFY(...) ...>;
                            - pattern: |
                                <... $VERIFY(...) && $RHS ...>;
                            - pattern: |
                                <... $LHS && $VERIFY(...) ...>;
                            - pattern: |
                                <... $VERIFY(...) || $RHS ...>;
                            - pattern: |
                                <... $LHS || $VERIFY(...) ...>;
                            - pattern: |
                                <... $VERIFY(...) ? $YES : $NO ...>;
                        - metavariable-regex:
                            metavariable: $VERIFY
                            regex: ^(([\w$]+\.)*(verifyGithubSignature|verifyTwilioRequest|verifyMetaSignature|verifySvixHeaders|verifySvix|verifyTimestampHmac|verifyProviderFeedbackRequest|verifyMandrillSignature|verifyMandrillForm|verifyMtaSignedRequest|verifyPluginInboundSignature|verifyPluginReplayBoundSignature|verifyPluginSvixDelivery|verifyPluginWebhookDelivery|verifyHookResponseSignature|verifyTrackingSignature|verifySnsMessage|verifySignature)|crypto\.subtle\.verify)$
      # Exempt when the enclosing function's own body passes the header
      # value to a synchronous compare, unless that call is in one of the bad forms.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  # The innermost statement holding the call.
                  - pattern: |
                      <... $COMPARE(..., <... $SIG ...>, ...) ...>;
                  - metavariable-regex:
                      metavariable: $COMPARE
                      regex: ^(([\w$]+\.)*(constantTimeEqual|secretMatches|timingSafeEqual)|crypto\.verify)$
                  # (a) the verdict goes into a `const` that nothing in its
                  # block reads, before or after.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                const $VERDICT = $COMPARE(...);
                            - pattern: |
                                const $VERDICT = await $COMPARE(...);
                        - pattern-not-inside: |
                            const $VERDICT = $VALUE;
                            ...
                            <... $VERDICT ...>;
                        - pattern-not-inside: |
                            <... $VERDICT ...>;
                            ...
                            const $VERDICT = $VALUE;
                  # (c) the call sits in a function that is declared or bound
                  # to a `const` and never referenced.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                const $UNUSED = (...) => $ARROWBODY;
                            - pattern: |
                                const $UNUSED = function (...) { ... };
                            - pattern: |
                                function $UNUSED(...) { ... }
                        - pattern-not-inside: |
                            const $UNUSED = $DEFINITION;
                            ...
                            <... $UNUSED ...>;
                        - pattern-not-inside: |
                            <... $UNUSED ...>;
                            ...
                            const $UNUSED = $DEFINITION;
                        - pattern-not-inside: |
                            function $UNUSED(...) { ... }
                            ...
                            <... $UNUSED ...>;
                        - pattern-not-inside: |
                            <... $UNUSED ...>;
                            ...
                            function $UNUSED(...) { ... }
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
