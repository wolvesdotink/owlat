rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Webhook handlers that read a signature header, check that it is
  # present, and do nothing else with it. Catches future regressions of
  # the C2 unverified-signature class.
  #
  # Reported: a signature-header read that the enclosing function only
  # ever tests for presence. A read is `$X.get('...')`, `$X['...']` or a
  # detached `get('...')` whose name is a plain string literal containing
  # "signature" (case-insensitive). It is either stored in a variable that
  # a later `if` or ternary tests, or tested inline in an `if` or a
  # `return ... ? ... : ...` (not inside an object literal, where adapters
  # declare presence predicates such as missingSignatureHeaders and verify
  # in a sibling method).
  #
  # Exempt: the enclosing function uses the stored value anywhere other
  # than in a presence test (passed to a call or `new`, compared with a
  # non-absence value, assigned into an object or property, spread,
  # destructured, returned: all count), or hands a direct
  # signature-header read to a call or `new`. Presence tests are `!x`,
  # `Boolean(x)`, `x` as an `if` condition, ternary test or left operand
  # of `&&`, and `==` / `===` / `!=` / `!==` against null, undefined or
  # '' (matched structurally, so parentheses do not matter). For a stored
  # read only that variable's uses count; an inline read is exempt if any
  # signature-header variable or read in the function is used.
  #
  # This is a syntactic presence-only check, not a verification proof.
  # Known limits, each with `todoruleid` / `todook` cases in the test:
  #   1. It does not check whether a verifier's result is awaited, read,
  #      or acted on: discarded, transformed, unawaited, wrapped or
  #      overwritten verdicts, and verifiers only in callbacks that never
  #      run, all count as a use.
  #   2. It does not check what the value is compared against, passed to
  #      or copied into: a self-compare, a public literal, a
  #      non-constant-time compare, a length check, a logging call, or a
  #      copy that is itself only presence-tested all count as a use.
  #   3. Header names that are not plain string literals (constants,
  #      template literals, escapes) are not recognised.
  #   4. Verification outside the function that reads the header is not
  #      seen: a handler that hands nothing on but has another function
  #      verify the request is reported.
  #
  # Tests: .semgrep/tests/webhook-signature-presence-only.ts, and one file
  # per read form under .semgrep/tests/gate/ (the file gate below is
  # per-file). Run each with `semgrep --test --config .semgrep.yml <file>`
  # (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-presence-only
    severity: ERROR
    languages: [typescript]
    message: |
      This handler reads a signature header and checks that it is present,
      but does nothing else with it. Pass the value to one of the existing
      verification helpers (webhooks/adapters/resend.ts verifySvixHeaders,
      webhooks/adapters/twilio.ts verifyTwilioRequest,
      webhooks/adapters/meta.ts verifyMetaSignature, or the constant-time
      compare in lib/crypto.ts, constantTimeEqual / secretMatches), await
      it, and reject the request when it fails. This check does not verify
      whether a verifier's result is awaited, read, or acted on. It does
      not check what the value is compared against or passed to. It only
      recognises header names written as plain string literals. It does
      not see verification that happens in another function.
    patterns:
      # Cheap gate first: only files with a string literal containing
      # "signature" are evaluated at all.
      - pattern-inside:
          pattern-regex: '(?i)\A(?=[\s\S]*[''"`][^''"`\n]*signature)[\s\S]*\z'
      - pattern-either:
          # A stored read that is later tested.
          - patterns:
              - pattern-either:
                  - pattern: |
                      $SIG = $HEADERS.get($HEADER)
                      ...
                      if (<... $SIG ...>) $THEN
                  - pattern: |
                      $SIG = $HEADERS.get($HEADER)
                      ...
                      <... <... $SIG ...> ? $YES : $NO ...>;
                  - pattern: |
                      $SIG = $HEADERS[$HEADER]
                      ...
                      if (<... $SIG ...>) $THEN
                  - pattern: |
                      $SIG = $HEADERS[$HEADER]
                      ...
                      <... <... $SIG ...> ? $YES : $NO ...>;
                  - pattern: |
                      $SIG = get($HEADER)
                      ...
                      if (<... $SIG ...>) $THEN
                  - pattern: |
                      $SIG = get($HEADER)
                      ...
                      <... <... $SIG ...> ? $YES : $NO ...>;
          # A read tested inline. Not inside an object literal: adapters
          # declare presence predicates there (missingSignatureHeaders) and
          # verify in a sibling method.
          - patterns:
              - pattern-either:
                  - pattern: |
                      if (<... $HEADERS.get($HEADER) ...>) $THEN
                  - pattern: |
                      return <... $HEADERS.get($HEADER) ...> ? $YES : $NO;
                  - pattern: |
                      if (<... $HEADERS[$HEADER] ...>) $THEN
                  - pattern: |
                      return <... $HEADERS[$HEADER] ...> ? $YES : $NO;
              - pattern-not-inside: |
                  { ..., $KEY: $VALUE, ... }
      - metavariable-regex:
          metavariable: $HEADER
          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
      # Exempt when the enclosing function uses the value, or a direct
      # signature-header read, other than in a presence test.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                pattern-either:
                  # A use of the stored value.
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $SIG = $STORED.get($STOREDNAME)
                              ...
                          - pattern-inside: |
                              $SIG = $STORED[$STOREDNAME]
                              ...
                          - pattern-inside: |
                              $SIG = get($STOREDNAME)
                              ...
                      - metavariable-regex:
                          metavariable: $STOREDNAME
                          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
                      - pattern: $SIG
                      # Not the variable's own declaration.
                      - pattern-not-inside: $SIG = $INIT
                      - pattern-not-inside: |
                          !$SIG
                      - pattern-not-inside: |
                          Boolean($SIG)
                      - pattern-not-inside: |
                          $SIG == null
                      - pattern-not-inside: |
                          null == $SIG
                      - pattern-not-inside: |
                          $SIG == undefined
                      - pattern-not-inside: |
                          undefined == $SIG
                      - pattern-not-inside: |
                          $SIG == ''
                      - pattern-not-inside: |
                          '' == $SIG
                      - pattern-not-inside: |
                          $SIG === null
                      - pattern-not-inside: |
                          null === $SIG
                      - pattern-not-inside: |
                          $SIG === undefined
                      - pattern-not-inside: |
                          undefined === $SIG
                      - pattern-not-inside: |
                          $SIG === ''
                      - pattern-not-inside: |
                          '' === $SIG
                      - pattern-not-inside: |
                          $SIG != null
                      - pattern-not-inside: |
                          null != $SIG
                      - pattern-not-inside: |
                          $SIG != undefined
                      - pattern-not-inside: |
                          undefined != $SIG
                      - pattern-not-inside: |
                          $SIG != ''
                      - pattern-not-inside: |
                          '' != $SIG
                      - pattern-not-inside: |
                          $SIG !== null
                      - pattern-not-inside: |
                          null !== $SIG
                      - pattern-not-inside: |
                          $SIG !== undefined
                      - pattern-not-inside: |
                          undefined !== $SIG
                      - pattern-not-inside: |
                          $SIG !== ''
                      - pattern-not-inside: |
                          '' !== $SIG
                      - pattern-not-inside:
                          patterns:
                            - pattern: if ($SIG) $PRESENT
                            - focus-metavariable: $SIG
                      - pattern-not-inside:
                          patterns:
                            - pattern: '$SIG ? $WHENSET : $WHENUNSET'
                            - focus-metavariable: $SIG
                      - pattern-not-inside:
                          patterns:
                            - pattern: $SIG && $ALSO
                            - focus-metavariable: $SIG
                  # A direct signature-header read handed to a call or
                  # constructor (a verifier that re-reads the header).
                  - patterns:
                      - pattern-either:
                          - pattern: |
                              <... $CALLEE(..., <... $REREAD.get($NAME) ...>, ...) ...>;
                          - pattern: |
                              <... new $CLASS(..., <... $REREAD.get($NAME) ...>, ...) ...>;
                          - pattern: |
                              <... $CALLEE(..., <... $REREAD[$NAME] ...>, ...) ...>;
                          - pattern: |
                              <... new $CLASS(..., <... $REREAD[$NAME] ...>, ...) ...>;
                      - metavariable-regex:
                          metavariable: $NAME
                          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
