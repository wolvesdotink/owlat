rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Webhook handlers that read a signature header and never verify it.
  # Catches future regressions of the C2 unverified-signature class.
  #
  # This is a syntactic guardrail, not a proof. It checks that the header
  # value reaches a verifier whose result is not thrown away; it cannot
  # show that the result decides whether the request is accepted.
  #
  # Reported: a `$X.get('...')` or `$X['...']` read whose string-literal
  # name contains "signature" (case-insensitive), followed by an `if` or a
  # ternary that tests it (`if (!sig)`, `if (sig)`, `sig !== null ? ...`),
  # unless the enclosing function's own body passes the header value, or
  # a value derived from it, to a verifier: a `verify*` function or method
  # (verifyGithubSignature, verifyTwilioRequest, verifyMetaSignature,
  # verifySvixHeaders, crypto.subtle.verify, ...) or a synchronous compare
  # (constantTimeEqual, secretMatches, timingSafeEqual, Node's
  # crypto.verify).
  #
  # Any use of that call's result counts, except these known-bad ones:
  #   (i)   a bare statement, so the result is discarded;
  #   (ii)  assigned to a variable that is never read afterwards;
  #   (iii) an unawaited `verify*` used as a condition, ternary test, or
  #         `!` / `&&` / `||` operand (every `verify*` helper is async);
  #   (iv)  only inside a nested function or callback.
  #
  # Known limits, recorded in the test as `todoruleid` (missed) or
  # `todook` (wrongly reported): an `if` on the verdict whose body is
  # empty or only logs; both branches accepting; a verdict overwritten
  # before it is read; the signature compared with itself or a literal; a
  # verification in a `try` whose `catch` swallows the error, or in only
  # one branch; an unawaited `verify*` stored in a variable and tested;
  # a destructured `Promise.all` result where the verdict is never read;
  # a bare verifier call whose previous line does not end in `;`, `{`,
  # `}` or a `//` comment, since (i) is a regex over that shape; a header
  # name held in a constant (missed); and a header value passed to
  # another function that verifies it (reported).
  #
  # Tests: .semgrep/tests/webhook-signature-presence-only.ts, run with
  # `semgrep --test --config .semgrep.yml <that file>` (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-presence-only
    severity: ERROR
    languages: [typescript]
    message: |
      This handler reads a signature header and tests it, but the header
      value never reaches a verifier whose result is used. Pass it to one
      of the existing verification helpers (webhooks/adapters/resend.ts
      verifySvixHeaders, webhooks/adapters/twilio.ts verifyTwilioRequest,
      webhooks/adapters/meta.ts verifyMetaSignature, or the constant-time
      compare in lib/crypto.ts, constantTimeEqual / secretMatches), await
      it, and reject the request when it fails. This is a syntactic check:
      it does not prove that the verdict controls acceptance.
    options:
      # `<... $SIG ...>` also matches a value derived from the header, e.g.
      # `const provided = signature.slice(7)`.
      symbolic_propagation: true
    patterns:
      # Cheap gate first: a file that never says "signature" cannot hold a
      # matching header read, and skipping it keeps the rule fast (the
      # exemptions below scan every function body).
      - pattern-inside:
          pattern-regex: '(?i)\A(?=[\s\S]*signature)[\s\S]*\z'
      - pattern-either:
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
      - metavariable-regex:
          metavariable: $HEADER
          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
      # Exempt when the enclosing function's own body passes the header
      # value to an async verify* and does not throw the result away.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  # The innermost statement holding the call.
                  - pattern: |
                      <... $VERIFY(..., <... $SIG ...>, ...) ...>;
                  - metavariable-regex:
                      metavariable: $VERIFY
                      regex: ^([\w$]+\.)*verify\w*$
                  # (iv) only inside a nested function or callback.
                  - pattern-not-inside: |
                      function $INNER(...) { ... }
                  - pattern-not-inside: |
                      function (...) { ... }
                  - pattern-not-inside: |
                      (...) => { ... }
                  - pattern-not-inside: |
                      (...) => $INNEREXPR
                  # (i) a bare statement, so the result is discarded. A regex,
                  # because an expression-statement pattern also matches the
                  # call inside a larger statement such as a return.
                  - pattern-not-inside:
                      pattern-regex: '(?:[;{}]|//[^\n]*)[ \t]*\n[ \t]*(?:await[ \t]+)?(?:[\w$]+\.)*(?:verify\w*|constantTimeEqual|secretMatches|timingSafeEqual)\([^;]*?\);'
                  # (ii) assigned to a variable that is never read afterwards.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                $VERDICT = $VERIFY(...);
                            - pattern: |
                                $VERDICT = await $VERIFY(...);
                        - pattern-not-inside: |
                            $VERDICT = $VALUE;
                            ...
                            <... $VERDICT ...>;
                  # (iii) an unawaited async verify* used as a truth value
                  # (a Promise is always truthy).
                  - pattern-not-inside: |
                      if ($VERIFY(...)) $BRANCH
                  - pattern-not-inside: |
                      <... !$VERIFY(...) ...>;
                  - pattern-not-inside: |
                      <... $VERIFY(...) && $RHS ...>;
                  - pattern-not-inside: |
                      <... $LHS && $VERIFY(...) ...>;
                  - pattern-not-inside: |
                      <... $VERIFY(...) || $RHS ...>;
                  - pattern-not-inside: |
                      <... $LHS || $VERIFY(...) ...>;
                  - pattern-not-inside: |
                      <... $VERIFY(...) ? $YES : $NO ...>;
      # Exempt when the enclosing function's own body passes the header
      # value to a synchronous compare and does not throw the result away.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  # The innermost statement holding the call.
                  - pattern: |
                      <... $COMPARE(..., <... $SIG ...>, ...) ...>;
                  - metavariable-regex:
                      metavariable: $COMPARE
                      regex: ^(([\w$]+\.)*(constantTimeEqual|secretMatches|timingSafeEqual)|crypto\.verify)$
                  # (iv) only inside a nested function or callback.
                  - pattern-not-inside: |
                      function $INNER(...) { ... }
                  - pattern-not-inside: |
                      function (...) { ... }
                  - pattern-not-inside: |
                      (...) => { ... }
                  - pattern-not-inside: |
                      (...) => $INNEREXPR
                  # (i) a bare statement, so the result is discarded. A regex,
                  # because an expression-statement pattern also matches the
                  # call inside a larger statement such as a return.
                  - pattern-not-inside:
                      pattern-regex: '(?:[;{}]|//[^\n]*)[ \t]*\n[ \t]*(?:await[ \t]+)?(?:[\w$]+\.)*(?:verify\w*|constantTimeEqual|secretMatches|timingSafeEqual)\([^;]*?\);'
                  # (ii) assigned to a variable that is never read afterwards.
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: |
                                $VERDICT = $COMPARE(...);
                            - pattern: |
                                $VERDICT = await $COMPARE(...);
                        - pattern-not-inside: |
                            $VERDICT = $VALUE;
                            ...
                            <... $VERDICT ...>;
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
