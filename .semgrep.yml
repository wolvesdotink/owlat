rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Signature headers are read only in reviewed verification modules.
  # Guards the C2 unverified-signature class by convention: a handler that
  # needs a signature checked routes the request through one of these
  # modules' verifiers instead of reading the header itself, so every
  # place that touches a signature header is one a reviewer has checked.
  #
  # Reported: every read of a value whose name is a plain string literal
  # containing "signature" (case-insensitive), whatever other characters
  # it holds, in any of these forms:
  # `$X.get('...')`, a detached `get('...')`, or `$X['...']`. Stored or
  # inline, verified or not: reading it outside the allowlist below is the
  # finding. That includes query parameters or form fields named like a
  # signature; they are signature reads too.
  #
  # The allowlist is `paths.exclude`. Each entry is a module whose
  # signature verification has been reviewed. Adding a file to it needs
  # the same review of that file's verification; do not add one to
  # silence a finding.
  #
  # Known limit (`todoruleid` cases in the test): a header name that is
  # not a plain string literal (a constant, a template literal) or a
  # literal that spells the word with escapes is not seen. mtaSignature.ts,
  # providerVerifierRegistry.ts and mtaRawRoute.ts read signature headers
  # through constants today for that reason.
  #
  # Tests: .semgrep/tests/webhook-signature-read-outside-verifier.ts and
  # one file per read form under .semgrep/tests/read-forms/. Run each with
  # `semgrep --test --config .semgrep.yml <file>` (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-read-outside-verifier
    severity: ERROR
    languages: [typescript]
    message: >-
      Signature headers must only be read in a reviewed verification module
      (allowlist in .semgrep.yml). Route the request through the module's
      verifier instead of reading the header here; if this file is a new
      verification module, add it to the allowlist after review.
    options:
      # Otherwise `"$NAME"` also matches a constant or a template literal
      # whose value is known, which would widen the rule past plain
      # string literals.
      constant_propagation: false
    patterns:
      # `"$NAME"` matches a plain string literal and binds $NAME to its
      # content only, without the quotes or anything around the literal
      # (comments, parentheses, `as` casts). `satisfies` and a non-null `!`
      # stay in the tree, so they get their own forms.
      - pattern-either:
          - pattern: $HEADERS.get("$NAME")
          - pattern: get("$NAME")
          - pattern: $HEADERS["$NAME"]
          - pattern: $HEADERS.get("$NAME" satisfies $TYPE)
          - pattern: get("$NAME" satisfies $TYPE)
          - pattern: $HEADERS["$NAME" satisfies $TYPE]
          - pattern: $HEADERS.get("$NAME"!)
          - pattern: get("$NAME"!)
          - pattern: $HEADERS["$NAME"!]
      # Not quote-aware on purpose: any content that contains the word.
      # metavariable-regex is anchored at the start, hence the prefix.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)[\s\S]*signature
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        # Reviewed verification modules. See the comment above before
        # adding one.
        - "/apps/api/convex/webhooks/githubHttp.ts"
        - "/apps/api/convex/webhooks/adapters/twilio.ts"
        - "/apps/api/convex/webhooks/adapters/meta.ts"
        - "/apps/api/convex/plugins/inboundSignature.ts"
