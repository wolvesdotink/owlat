rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Webhook handlers that read a signature header, check that it is
  # present, and never hand its value to anything that could verify it.
  # Catches future regressions of the C2 unverified-signature class.
  #
  # Reported: a `$X.get('...')` or `$X['...']` read whose name is a plain
  # string literal containing "signature" (case-insensitive), followed by
  # an `if` or a ternary that tests the value (`if (!sig)`, `if (sig)`,
  # `sig !== null ? ...`), when nowhere in the enclosing function is the
  # value, or a value derived from it (`signature.slice(7)`):
  #   - passed as an argument to any call or `new`, or
  #   - an operand of `===` / `!==` / `==` / `!=` against something other
  #     than null, undefined or an empty string,
  # and no call in that function takes a signature-header read directly
  # as an argument (a verifier that re-reads the header).
  #
  # This is a syntactic presence-only check, not a verification proof.
  # Known limits, each with a `todoruleid` or `todook` case in the test:
  #   - It does not check that a verifier's result is awaited, read or
  #     acted on: discarded, transformed, unawaited, wrapped or
  #     overwritten verdicts, and verifiers only in callbacks that never
  #     run, all count as verification.
  #   - It does not check what the value is compared against or passed
  #     to: a self-compare, a public literal, a non-constant-time compare,
  #     a length check or a logging call all count.
  #   - Header names that are not plain string literals (constants,
  #     template literals, escapes) are not recognised.
  #   - Verification outside the function that reads the header is not
  #     seen, so a handler that passes nothing on but verifies elsewhere
  #     is reported.
  #
  # Tests: .semgrep/tests/webhook-signature-presence-only.ts, run with
  # `semgrep --test --config .semgrep.yml <that file>` (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-presence-only
    severity: ERROR
    languages: [typescript]
    message: |
      This handler reads a signature header and checks that it is present,
      but never passes its value to a verifier or compares it. Pass it to
      one of the existing verification helpers (webhooks/adapters/resend.ts
      verifySvixHeaders, webhooks/adapters/twilio.ts verifyTwilioRequest,
      webhooks/adapters/meta.ts verifyMetaSignature, or the constant-time
      compare in lib/crypto.ts, constantTimeEqual / secretMatches), await
      it, and reject the request when it fails.
      Limits of this syntactic check: it does not check that a verifier's
      result is awaited or acted on; it does not check what the value is
      compared against or passed to; it only recognises header names
      written as plain string literals; and it does not see verification
      in another function.
    options:
      # `<... $SIG ...>` also matches a value derived from the header, e.g.
      # `const provided = signature.slice(7)`.
      symbolic_propagation: true
    patterns:
      # Cheap gate first: only files that read a header whose literal name
      # contains "signature" are evaluated at all.
      - pattern-inside:
          pattern-regex: '(?i)\A(?=[\s\S]*(?:\.get\(\s*|\[\s*)[''"`][^''"`\n]*signature)[\s\S]*\z'
      - pattern-either:
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... $SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              <... <... $SIG ...> ? $YES : $NO ...>;
      - metavariable-regex:
          metavariable: $HEADER
          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
      # Exempt when the enclosing function hands the value on or compares it.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                pattern-either:
                  # The value goes into a call or a constructor.
                  - pattern: |
                      <... $CALLEE(..., <... $SIG ...>, ...) ...>;
                  - pattern: |
                      <... new $CLASS(..., <... $SIG ...>, ...) ...>;
                  # The value is compared with something that is not an
                  # absence check.
                  - patterns:
                      - pattern-either:
                          - pattern: |
                              <... <... $SIG ...> === $OTHER ...>;
                          - pattern: |
                              <... $OTHER === <... $SIG ...> ...>;
                          - pattern: |
                              <... <... $SIG ...> !== $OTHER ...>;
                          - pattern: |
                              <... $OTHER !== <... $SIG ...> ...>;
                          - pattern: |
                              <... <... $SIG ...> == $OTHER ...>;
                          - pattern: |
                              <... $OTHER == <... $SIG ...> ...>;
                          - pattern: |
                              <... <... $SIG ...> != $OTHER ...>;
                          - pattern: |
                              <... $OTHER != <... $SIG ...> ...>;
                      - metavariable-regex:
                          metavariable: $OTHER
                          regex: ^(?!(null|undefined|void 0|''|""|``)$)
                  # A call re-reads a signature header as an argument.
                  - patterns:
                      - pattern-either:
                          - pattern: |
                              <... $CALLEE(..., $REREAD.get($NAME), ...) ...>;
                          - pattern: |
                              <... $CALLEE(..., $REREAD[$NAME], ...) ...>;
                      - metavariable-regex:
                          metavariable: $NAME
                          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
