rules:
  # ────────────────────────────────────────────────────────────────────
  # Owlat-specific: Convex mutation/query that accepts a user-controlled
  # userId via v.string() without calling getMutationContext /
  # getUserIdFromSession / getBetterAuthSessionWithRole in its body.
  # The C1 incident (adaptiveDashboard.ts IDOR across 5 endpoints)
  # happened because nothing structurally prevented this shape from
  # shipping.
  # ────────────────────────────────────────────────────────────────────
  - id: convex-userid-without-session-check
    severity: ERROR
    languages: [typescript]
    message: |
      This Convex query/mutation accepts a caller-supplied `userId` via
      `v.string()`. Use the session helper instead (`getUserIdFromSession`,
      `getMutationContext`, or `getBetterAuthSessionWithRole`) so a caller
      cannot read/write another user's data. If the caller-supplied id is
      intentional (e.g. an admin-only endpoint operating on a target user),
      gate it with `requireAdminContext` first and add a `// PUBLIC` marker
      explaining why.
    patterns:
      - pattern-either:
          - pattern: |
              $X = mutation({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
          - pattern: |
              $X = query({
                args: { ..., userId: v.string(), ... },
                handler: async (...) => { ... },
              })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getMutationContext(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getUserIdFromSession(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await getBetterAuthSessionWithRole(...)
              ...
            },
          })
      - pattern-not-inside: |
          $X = $FN({
            args: { ..., userId: v.string(), ... },
            handler: async ($CTX, $ARGS) => {
              ...
              $SESSION = await requireAdminContext(...)
              ...
            },
          })
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
      exclude:
        - "/apps/api/convex/_generated/**"
        - "/apps/api/convex/**/*test*.ts"
        - "/apps/api/convex/**/__tests__/**"

  # ────────────────────────────────────────────────────────────────────
  # navigateTo / window.location.href with a route-query value that
  # wasn't passed through safeRedirect. Catches future regressions of
  # the C3 open-redirect class.
  # ────────────────────────────────────────────────────────────────────
  - id: nuxt-unguarded-redirect-from-query
    severity: WARNING
    languages: [vue, typescript]
    message: |
      Avoid handing a `route.query.*` value directly to `navigateTo()` or
      `window.location.href`. Pass it through `safeRedirect(value, fallback)`
      (in `apps/web/app/utils/safeRedirect.ts`) so an attacker can't craft
      `?redirect=https://evil.com` to bounce authenticated users off-site.
    patterns:
      - pattern-either:
          - pattern: navigateTo($ROUTE.query.$KEY)
          - pattern: navigateTo($ROUTE.query.$KEY ?? $FALLBACK)
          - pattern: navigateTo($ROUTE.query.$KEY || $FALLBACK)
          - pattern: window.location.href = $ROUTE.query.$KEY
          - pattern: window.location.href = $ROUTE.query.$KEY ?? $FALLBACK
          - pattern: window.location.href = $ROUTE.query.$KEY || $FALLBACK
      - pattern-not: safeRedirect($X, $Y)

  # ────────────────────────────────────────────────────────────────────
  # Webhook handlers that read a signature header and never verify it.
  # Catches future regressions of the C2 unverified-signature class.
  #
  # This is a syntactic guardrail, not a proof. It checks that the header
  # value reaches a verifier whose result is used; it cannot show that the
  # result actually decides whether the request is accepted.
  #
  # Reported: a `$X.get('...')` or `$X['...']` read whose string-literal
  # name contains "signature" (case-insensitive), followed by a presence
  # check, unless the same function (anywhere in its own control flow,
  # including `if`/`else` branches and `try` blocks, but not inside a
  # nested function or callback) passes the header value, or a value
  # derived from it, to
  #   - an awaited `verify*` function or method (verifyGithubSignature,
  #     verifyTwilioRequest, verifyMetaSignature, verifySvixHeaders,
  #     crypto.subtle.verify, ...; they are all async), awaited directly
  #     or through `Promise.all` / `.then`, or
  #   - a synchronous compare: constantTimeEqual, secretMatches,
  #     timingSafeEqual or Node's crypto.verify,
  # and uses the verdict: in an `if` condition, a ternary, a `return`, or
  # a variable that is read afterwards.
  #
  # So it catches: a presence-only check; a verifier given some other
  # value; an unawaited `verify*` call; a verdict that is assigned and
  # never read; a verifier that runs only in a nested callback.
  #
  # Known limits (false negatives, recorded as `todoruleid` in the test):
  # an `if` on the verdict whose body is empty or only logs; both branches
  # accepting; a verdict overwritten before it is read; the signature
  # compared with itself or with a literal; a verification inside a `try`
  # whose `catch` swallows the error; a verification in only one branch.
  # Also not seen: a header name held in a constant, and a header value
  # passed out of the function to be verified elsewhere. For a
  # destructured `Promise.all`, reading any destructured name later counts
  # as reading the verdict.
  #
  # Tests: .semgrep/tests/webhook-signature-presence-only.ts, run with
  # `semgrep --test --config .semgrep.yml <that file>` (security.yml does).
  # ────────────────────────────────────────────────────────────────────
  - id: webhook-signature-presence-only
    severity: ERROR
    languages: [typescript]
    message: |
      This handler reads a signature header and checks that it is present,
      but the header value never reaches a verifier whose result is used.
      Pass it to one of the existing verification helpers
      (webhooks/adapters/resend.ts verifySvixHeaders,
      webhooks/adapters/twilio.ts verifyTwilioRequest,
      webhooks/adapters/meta.ts verifyMetaSignature, or the constant-time
      compare in lib/crypto.ts, constantTimeEqual / secretMatches), await
      it, and reject the request when it fails. This is a syntactic check:
      it does not prove that the verdict controls acceptance.
    options:
      # `<... $SIG ...>` also matches a value derived from the header, e.g.
      # `const provided = signature.slice(7)`.
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... !$SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... $SIG == null ...>) $THEN
          - pattern: |
              $SIG = $HEADERS.get($HEADER)
              ...
              if (<... $SIG === null ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... !$SIG ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... $SIG == null ...>) $THEN
          - pattern: |
              $SIG = $HEADERS[$HEADER]
              ...
              if (<... $SIG === undefined ...>) $THEN
      - metavariable-regex:
          metavariable: $HEADER
          regex: (?i)^['"`][^'"`]*signature[^'"`]*['"`]$
      # Exempt when the enclosing function's own body (nested functions
      # excluded) uses an awaited verify* verdict on the header value.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  - pattern-either:
                      - pattern: |
                          if (<... await <... $VERIFY(..., <... $SIG ...>, ...) ...> ...>) $GATED
                      - pattern: |
                          return <... await <... $VERIFY(..., <... $SIG ...>, ...) ...> ...>;
                      - pattern: |
                          <... await <... $VERIFY(..., <... $SIG ...>, ...) ...> ...> ? $YES : $NO
                      - pattern: |
                          $VERDICT = <... await <... $VERIFY(..., <... $SIG ...>, ...) ...> ...>;
                          ...
                          <... $VERDICT ...>;
                      - pattern: |
                          [..., $VERDICT, ...] = <... await <... $VERIFY(..., <... $SIG ...>, ...) ...> ...>;
                          ...
                          <... $VERDICT ...>;
                  - pattern-not-inside: |
                      function $INNER(...) { ... }
                  - pattern-not-inside: |
                      function (...) { ... }
                  - pattern-not-inside: |
                      (...) => { ... }
                  - pattern-not-inside: |
                      (...) => $INNEREXPR
                  - metavariable-regex:
                      metavariable: $VERIFY
                      regex: ^([\w$]+\.)*verify\w*$
      # Same, for a synchronous compare.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    function $FN(...) { $...BODY }
                - pattern: |
                    function (...) { $...BODY }
                - pattern: |
                    (...) => { $...BODY }
            # An empty body has no range for metavariable-pattern to scan.
            - pattern-not: |
                function $FN(...) {}
            - pattern-not: |
                function (...) {}
            - pattern-not: |
                (...) => {}
            - metavariable-pattern:
                metavariable: $...BODY
                patterns:
                  - pattern-either:
                      - pattern: |
                          if (<... $COMPARE(..., <... $SIG ...>, ...) ...>) $GATED
                      - pattern: |
                          return <... $COMPARE(..., <... $SIG ...>, ...) ...>;
                      - pattern: |
                          <... $COMPARE(..., <... $SIG ...>, ...) ...> ? $YES : $NO
                      - pattern: |
                          $VERDICT = <... $COMPARE(..., <... $SIG ...>, ...) ...>;
                          ...
                          <... $VERDICT ...>;
                      - pattern: |
                          [..., $VERDICT, ...] = <... $COMPARE(..., <... $SIG ...>, ...) ...>;
                          ...
                          <... $VERDICT ...>;
                  - pattern-not-inside: |
                      function $INNER(...) { ... }
                  - pattern-not-inside: |
                      function (...) { ... }
                  - pattern-not-inside: |
                      (...) => { ... }
                  - pattern-not-inside: |
                      (...) => $INNEREXPR
                  - metavariable-regex:
                      metavariable: $COMPARE
                      regex: ^(([\w$]+\.)*(constantTimeEqual|secretMatches|timingSafeEqual)|crypto\.verify)$
    paths:
      include:
        - "/apps/api/convex/**/*.ts"
