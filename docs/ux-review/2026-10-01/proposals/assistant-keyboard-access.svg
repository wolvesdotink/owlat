<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  10</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">make conversation selection and the question field accessible</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Give the main action a real control, and name the question field persistently.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="72" y="218" fill="#171717" font-size="19" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Conversations</text><rect x="72" y="240" width="298" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="86" y="265" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">New chat</text><rect x="72" y="300" width="298" height="52" rx="9" fill="#ffffff" stroke="#e4e4e4"/><text x="88" y="331" fill="#171717" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Campaign performance review</text><text x="344" y="331" fill="#171717" font-size="18" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">⋯</text><rect x="72" y="366" width="298" height="52" rx="9" fill="#f5f1ee" stroke="#b86b4d"/><text x="88" y="397" fill="#171717" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft a customer reply</text><text x="344" y="397" fill="#171717" font-size="18" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">⋯</text><rect x="72" y="432" width="298" height="52" rx="9" fill="#ffffff" stroke="#e4e4e4"/><text x="88" y="463" fill="#171717" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Ideas for the next newsletter</text><text x="344" y="463" fill="#171717" font-size="18" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">⋯</text><rect x="68" y="362" width="306" height="60" rx="12" fill="none" stroke="#b86b4d" stroke-width="3"/><circle cx="87" cy="368" r="13" fill="#b86b4d"/><text x="83" y="373" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="425" y="218" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft a customer reply</text><rect x="425" y="250" width="667" height="198" rx="12" fill="#f4f3f1" stroke="#f4f3f1"/><text x="451" y="287" fill="#666666" font-size="16" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Assistant’s response appears here. Conversation selection uses</text><text x="451" y="312" fill="#666666" font-size="16" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">a semantic button or link with a selected state.</text><text x="425" y="492" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Question</text><rect x="425" y="504" width="667" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="437" y="530" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Write your follow-up here…</text><text x="425" y="568" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Enter to send · Shift+Enter for a new line</text><rect x="951" y="586" width="142" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="965" y="611" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Send</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Tab reaches the conversation itself; Enter opens it. Actions use a</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">separate menu.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">The Question label remains meaningful after typing and help</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">text is associated with the field.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>