<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  01</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">resolve conflicting identity mappings before preview and submission</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Make the mapping explicit and show exactly what will be imported.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="72" y="218" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Import contacts</text><text x="72" y="247" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Upload   →   Map columns   →   Preview   →   Import</text><text x="80" y="304" fill="#171717" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">email</text><rect x="382" y="279" width="458" height="43" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="398" y="306" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Email address · Primary identity</text><text x="807" y="306" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">▾</text><text x="80" y="370" fill="#171717" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">secondary_email</text><rect x="382" y="345" width="458" height="43" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="398" y="372" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Choose destination…</text><text x="807" y="372" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">▾</text><rect x="382" y="400" width="710" height="85" rx="10" fill="#faf0ee" stroke="#faf0ee"/><text x="400" y="428" fill="#a85545" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Email address is already mapped to “email”.</text><rect x="400" y="442" width="230" height="38" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="414" y="467" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Use this column instead</text><rect x="645" y="442" width="176" height="38" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="659" y="467" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Ignore this column</text><rect x="72" y="511" width="1020" height="68" rx="10" fill="#f4f3f1" stroke="#f4f3f1"/><text x="91" y="538" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Preview and import share the same prepared row</text><text x="91" y="562" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Primary email: alex@owlat.example</text><rect x="938" y="593" width="154" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="952" y="618" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Review import</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Resolve conflicting mappings before continuing. Never silently choose a</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">different identity.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">One row preparation path drives validation, preview and</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">submission.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>