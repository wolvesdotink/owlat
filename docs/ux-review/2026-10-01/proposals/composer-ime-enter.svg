<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  11</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">do not send messages while Enter confirms IME composition</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Enter confirms a language candidate before it can send the message.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="74" y="218" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Compose a message</text><text x="74" y="254" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Writing with a Japanese, Chinese or Korean input method</text><rect x="74" y="282" width="1000" height="98" rx="12" fill="#ffffff" stroke="#b86b4d"/><text x="98" y="321" fill="#171717" font-size="20" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Message being composed…</text><rect x="831" y="303" width="93.5" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="843" y="321" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Composing</text><rect x="96" y="360" width="573" height="144" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="117" y="391" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Input method candidate selection</text><text x="117" y="430" fill="#171717" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">1  Candidate A       2  Candidate B       3  Candidate C</text><text x="117" y="472" fill="#b86b4d" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Enter confirms selection</text><text x="718" y="424" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Enter → confirm candidate</text><text x="718" y="462" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Next deliberate Enter → send</text><rect x="927" y="549" width="147" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="941" y="574" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Send</text><text x="74" y="609" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Same composition-safe behavior in Chat and Assistant.</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">During composition, the editor never prevents confirmation or invokes</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Send.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">After composition ends, Enter and Shift+Enter retain their</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">expected behavior.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>