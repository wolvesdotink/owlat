<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  12</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">explain invalid custom times and show the scheduling timezone</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Make time interpretation explicit and explain why a date cannot be scheduled.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><rect x="289" y="199" width="624" height="419" rx="14" fill="#ffffff" stroke="#e4e4e4"/><text x="316" y="239" fill="#171717" font-size="23" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Schedule send</text><text x="316" y="273" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Your timezone: Europe/Berlin · UTC+02:00</text><rect x="316" y="294" width="568" height="50" rx="8" fill="#f5f1ee" stroke="#f5f1ee"/><text x="332" y="325" fill="#171717" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Tomorrow morning</text><text x="719" y="325" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">09:00 your time</text><text x="316" y="371" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Custom date and time</text><rect x="316" y="383" width="568" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="328" y="409" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">30 Sep 2026     09:00</text><text x="316" y="448" fill="#a85545" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Choose a future date and time.</text><path d="M316 470h568" stroke="#e4e4e4"/><text x="316" y="501" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Confirmation</text><text x="316" y="527" fill="#666666" font-size="16" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Select a future time to see confirmation</text><text x="316" y="553" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">A valid time will show both the local clock and UTC.</text><rect x="316" y="573" width="124" height="38" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="330" y="598" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Cancel</text><rect x="733" y="573" width="151" height="38" rx="8" fill="#e4e4e4" stroke="#e4e4e4"/><text x="748" y="598" fill="#666666" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Schedule</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Past dates get an inline accessible error; the click cannot silently do</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">nothing.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Always name the sender timezone and confirm the resulting</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">instant before scheduling.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>