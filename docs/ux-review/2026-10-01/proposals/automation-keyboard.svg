<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  04</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">support keyboard step selection and reordering</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Make configuring and ordering a workflow possible without dragging.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="98" y="216" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Welcome series</text><rect x="98" y="233" width="63.5" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="110" y="251" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft</text><rect x="98" y="277" width="543" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="114" y="306" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">1  Send welcome email</text><text x="114" y="329" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Welcome email · Ready</text><rect x="98" y="366" width="543" height="72" rx="10" fill="#ffffff" stroke="#b86b4d"/><text x="114" y="395" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">2  Wait before following up</text><text x="114" y="418" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">2 days</text><rect x="98" y="455" width="543" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="114" y="484" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">3  Check engagement</text><text x="114" y="507" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Opened welcome email?</text><rect x="94" y="362" width="551" height="80" rx="13" fill="none" stroke="#b86b4d" stroke-width="3"/><circle cx="120" cy="374" r="13" fill="#b86b4d"/><text x="116" y="379" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><rect x="662" y="367" width="143" height="38" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="676" y="392" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Move step ▾</text><rect x="662" y="411" width="243" height="160" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="680" y="443" fill="#171717" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Move up</text><text x="680" y="485" fill="#171717" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Move down</text><text x="680" y="527" fill="#171717" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Move to position…</text><rect x="934" y="235" width="193" height="277" rx="12" fill="#f5f1ee" stroke="#f5f1ee"/><text x="951" y="267" fill="#b86b4d" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Keyboard</text><text x="951" y="304" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Tab</text><text x="951" y="327" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Focus a step</text><text x="951" y="364" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Enter</text><text x="951" y="387" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Edit the step</text><text x="951" y="424" fill="#171717" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Move</text><text x="951" y="447" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Change order</text><text x="98" y="596" fill="#55744b" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Moved “Wait before following up” to position 2 of 3.</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">The step title is a semantic selection control with a visible focus ring.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Move actions preserve focus and announce the new order. Drag</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">remains available.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>