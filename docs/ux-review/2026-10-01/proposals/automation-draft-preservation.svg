<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  03</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">preserve pending or failed step edits across inspector and structure changes</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Protect unfinished step edits when the inspector closes or the workflow changes.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="76" y="221" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Welcome series</text><rect x="76" y="238" width="63.5" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="88" y="256" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft</text><rect x="76" y="282" width="405" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="92" y="311" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">1  Send welcome email</text><text x="92" y="334" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Welcome email · Ready</text><rect x="76" y="371" width="405" height="72" rx="10" fill="#ffffff" stroke="#b86b4d"/><text x="92" y="400" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">2  Wait before following up</text><text x="92" y="423" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">2 days</text><rect x="76" y="460" width="405" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="92" y="489" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">3  Check engagement</text><text x="92" y="512" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Opened welcome email?</text><text x="700" y="228" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Wait before following up</text><text x="700" y="266" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Duration</text><rect x="700" y="278" width="374" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="712" y="304" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="700" y="342" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Unit</text><rect x="700" y="354" width="374" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="712" y="380" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Days                         ▾</text><text x="700" y="423" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">After the welcome email is sent</text><rect x="657" y="493" width="445" height="88" rx="10" fill="#f5f1ee" stroke="#f5f1ee"/><text x="676" y="520" fill="#171717" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Unsaved changes · draft retained</text><rect x="676" y="535" width="120" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="6