ight="400" font-family="DejaVu Sans,Arial,sans-serif">All changes saved</text><rect x="514" y="560" width="273" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="528" y="585" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Done</text><text x="859" y="255" fill="#171717" font-size="19" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Phone interaction</text><text x="859" y="291" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">1. See every step. 2.</text><text x="859" y="315" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Select one to edit. 3.</text><text x="859" y="339" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Return to the same step.</text><text x="859" y="414" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Desktop keeps a side</text><text x="859" y="437" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">inspector. Phone uses a full-</text><text x="859" y="460" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">width sheet with a sticky</text><text x="859" y="483" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">action footer.</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">The empty 384px inspector no longer consumes the phone canvas.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Back restores step focus and follows the same save/draft</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">rules as desktop.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>