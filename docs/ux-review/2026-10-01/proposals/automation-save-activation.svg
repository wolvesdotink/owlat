<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  02</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">make save status and activation reflect the persisted configuration</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Show what is saved, and activate only the configuration the user can see.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="72" y="218" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Welcome series</text><rect x="300" y="197" width="63.5" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="312" y="215" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft</text><rect x="680" y="197" width="221.0" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="692" y="215" fill="#a85545" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Changes could not be saved</text><rect x="935" y="194" width="182" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="949" y="219" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Save and activate</text><text x="88" y="265" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Workflow</text><rect x="88" y="282" width="63.5" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="100" y="300" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Draft</text><rect x="88" y="326" width="450" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="104" y="355" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">1  Send welcome email</text><text x="104" y="378" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Welcome email · Ready</text><rect x="88" y="415" width="450" height="72" rx="10" fill="#ffffff" stroke="#b86b4d"/><text x="104" y="444" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">2  Wait before following up</text><text x="104" y="467" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">2 days</text><rect x="88" y="504" width="450" height="72" rx="10" fill="#ffffff" stroke="#e4e4e4"/><text x="104" y="533" fill="#171717" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">3  Check engagement</text><text x="104" y="556" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Opened welcome email?</text><text x="684" y="274" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Wait before following up</text><text x="684" y="312" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Duration</text><rect x="684" y="324" width="388" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="696" y="350" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="684" y="388" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Unit</text><rect x="684" y="400" width="388" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="696" y="426" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Days                         ▾</text><text x="684" y="469" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">After the welcome email is sent</text><rect x="667" y="492" width="456" height="56" rx="10" fill="#faf0ee" stroke="#faf0ee"/><text x="687" y="516" fill="#a85545" font-size="15" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Your changes are still here.</text><text x="687" y="537" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Retry saving before activation.</text><rect x="683" y="570" width="126" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="697" y="595" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Retry save</text><text x="833" y="594" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Last saved 2 minutes ago</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Persistent Saving / Saved / Failed status replaces ambiguous success</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">toasts.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Save and activate waits for the current revision. A failure</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">leaves the workflow in draft.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>