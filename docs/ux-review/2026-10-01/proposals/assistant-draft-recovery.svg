<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  08</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">retain questions until send succeeds and offer inline retry</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">A failed send should preserve the question and show a clear recovery action.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="74" y="219" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Assistant</text><rect x="74" y="251" width="1026" height="126" rx="12" fill="#f5f1ee" stroke="#f5f1ee"/><text x="95" y="284" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Your recent conversation</text><text x="95" y="320" fill="#171717" font-size="17" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">September’s open rate improved. Would you like to compare the subject lines or the</text><text x="95" y="346" fill="#171717" font-size="17" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">audience?</text><rect x="74" y="417" width="1026" height="60" rx="10" fill="#faf0ee" stroke="#faf0ee"/><text x="94" y="442" fill="#a85545" font-size="16" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Could not send. Your question is still here.</text><text x="94" y="464" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Check your connection, then retry.</text><rect x="973" y="429" width="105" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="987" y="454" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Retry</text><text x="74" y="507" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Question</text><rect x="74" y="520" width="1026" height="67" rx="10" fill="#ffffff" stroke="#b86b4d"/><text x="92" y="550" fill="#171717" font-size="16" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Compare the last three campaigns and suggest a subject line.</text><text x="92" y="575" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Please consider the Product updates audience.</text><text x="74" y="614" fill="#666666" font-size="13" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Draft retained · Enter to send · Shift+Enter for a new line</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Clear the submitted snapshot only after the backend acknowledges it.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">One pending send at a time. New typing and failed drafts</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">stay recoverable.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>