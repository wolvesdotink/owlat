<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f4f3f1" stroke="#f4f3f1"/><text x="36" y="38" fill="#b86b4d" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">OWLAT  /  EXPERIENCE REVIEW</text><text x="980" y="38" fill="#666666" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">CONCEPT  09</text><text x="36" y="78" fill="#171717" font-size="25" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">preserve reading position while responses stream</text><text x="36" y="106" fill="#666666" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Let readers inspect an answer while new content continues below.</text><rect x="36" y="128" width="1128" height="512" rx="16" fill="#ffffff" stroke="#e4e4e4"/><text x="60" y="161" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Owlat</text><text x="150" y="160" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Design proposal · example data</text><path d="M36 178h1128" stroke="#e4e4e4"/><text x="74" y="218" fill="#171717" font-size="22" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Assistant · Campaign analysis</text><text x="100" y="273" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">1. Audience quality</text><text x="100" y="306" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Engaged contacts account for most of the increase in opens.</text><text x="100" y="358" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">2. Subject line</text><text x="100" y="391" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Specific language performed better than a broad seasonal greeting.</text><text x="100" y="443" fill="#171717" font-size="18" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">3. Send time</text><text x="100" y="476" fill="#666666" font-size="15" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Tuesday morning reached more of this audience before lunch.</text><rect x="939" y="263" width="8" height="247" rx="4" fill="#f4f3f1" stroke="#f4f3f1"/><rect x="939" y="294" width="8" height="88" rx="4" fill="#b86b4d" stroke="#b86b4d"/><rect x="770" y="510" width="131.0" height="26" rx="13" fill="#f5f1ee" stroke="#f5f1ee"/><text x="782" y="528" fill="#b86b4d" font-size="12" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">New response ↓</text><rect x="803" y="548" width="212" height="38" rx="8" fill="#171717" stroke="#171717"/><text x="817" y="573" fill="#ffffff" font-size="14" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Jump to latest</text><text x="74" y="550" fill="#666666" font-size="13" font-weight="550" font-family="DejaVu Sans,Arial,sans-serif">Question</text><rect x="74" y="562" width="647" height="40" rx="8" fill="#ffffff" stroke="#e4e4e4"/><text x="86" y="588" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Ask a follow-up…</text><circle cx="50" cy="677" r="13" fill="#b86b4d"/><text x="46" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="75" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Scrolling away pauses auto-follow so each new token cannot pull the reader</text><text x="75" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">back.</text><circle cx="635" cy="677" r="13" fill="#b86b4d"/><text x="631" y="682" fill="#ffffff" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="660" y="683" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">A quiet jump control signals new content and resumes</text><text x="660" y="706" fill="#171717" font-size="14" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">following on purpose.</text><text x="36" y="750" fill="#666666" font-size="12" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Illustrative wireframe. Reuse the app’s tokens, shared controls, localization and focus behavior.</text></svg>