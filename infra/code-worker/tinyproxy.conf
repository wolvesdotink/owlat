# Allowlisted egress forward-proxy for the untrusted code-worker (security
# review M4, defence-in-depth). The code-worker runs attacker-influenced,
# inbound-email-driven code; pinning its outbound HTTP(S) through this proxy —
# with FilterDefaultDeny — means a compromised task can reach ONLY the three
# origins a legitimate run needs (the Convex function-allowlist proxy, the git
# remote, and the LLM endpoint) and nothing else on the internet.
#
# The worker is forced through here by HTTP_PROXY/HTTPS_PROXY in its compose
# service env (git honours the same variables; the orchestrator's own node fetch
# via NODE_USE_ENV_PROXY=1). This is structural, not advisory: the worker's
# `code-worker` network is `internal: true`, so it has NO route to the internet
# of its own and cannot bypass the allowlist by ignoring those vars. This proxy
# is the ONLY container on both the isolated `code-worker` network (where the
# worker and convex-fn-proxy live) and the internet-capable `default` network,
# so it is the sole egress path.

User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100

# Which client IPs may use the proxy. Only the code-worker shares this proxy's
# network, so restrict to the Docker private ranges as defence-in-depth on top
# of that isolation. (tinyproxy denies every client unless an Allow matches.)
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Host allowlist. FilterDefaultDeny Yes ⇒ a destination is refused unless it
# matches a pattern in the filter file; FilterExtended uses POSIX extended
# regex, matched against the destination host (FilterURLs Off).
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off

# CONNECT (HTTPS tunnel) is limited to 443 for the git remote / LLM endpoint.
# Plain HTTP to convex-fn-proxy:3220 is proxied directly (no CONNECT), so its
# port is not listed here — the host filter above is what gates it.
ConnectPort 443

# Do not leak that traffic transited a proxy.
DisableViaHeader Yes
