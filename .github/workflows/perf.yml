name: Perf budgets

# The component performance scenarios (apps/web/perf) in system Chrome, failed
# when any run of any scenario breaks one of its committed counter budgets
# (apps/web/perf/budgets.ts): component updates, DOM mutations, elements
# rendered, rows a live update re-renders, and what a teardown leaves behind.
# Wall-clock timings are reported, never gated.
#
# A separate workflow rather than a Test Summary job: it needs Google Chrome
# (the scenarios launch Playwright's `chrome` channel, not its bundled
# Chromium) and a few minutes of real-time streaming, so it runs nightly, on
# dispatch, and on the pull requests that change the harness or its budgets.
# Needs no secrets and no backend: the scenarios mount components with
# synthetic props.

on:
  pull_request:
    paths:
      - 'apps/web/perf/**'
      - 'scripts/perf-bench/scenarioWriterLimits.ts'
      - '.github/workflows/perf.yml'
  schedule:
    - cron: '15 5 * * *' # nightly, after the e2e and kill-test runs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: Perf budgets (web components)
    runs-on: ubuntu-latest
    # Steps: 2 + 5 + 10 + 10 + 20 + 5 = 52, under the job cap with room for the
    # actions' pre/post steps. A whole run of the scenarios takes 3-5 minutes.
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        timeout-minutes: 2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5

      - uses: ./.github/actions/setup-bun
        timeout-minutes: 10

      # The runner image ships a Chrome, but its version is the image's; this
      # installs the current stable release explicitly, the same channel the
      # budgets were measured on.
      - name: Install Google Chrome
        timeout-minutes: 10
        run: cd apps/web && bunx playwright install --with-deps chrome

      - name: Run the scenarios against their budgets
        timeout-minutes: 20
        run: bun run --cwd apps/web perf:gate --out "$RUNNER_TEMP/perf-report"

      - name: Upload the perf report
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report/
          if-no-files-found: ignore
          retention-days: 14
