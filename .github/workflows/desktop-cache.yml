name: Desktop release cache
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-cache.yml'
      - '.github/workflows/_desktop-build.yml'
  workflow_dispatch: {}
  # Access caches more often than GitHub's seven-day idle eviction window.
  schedule:
    - cron: '23 5 * * 1,4'
permissions:
  contents: read
concurrency:
  group: desktop-release-cache
  cancel-in-progress: false
jobs:
  warm:
    name: Warm release dependencies (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: ''
          - os: ubuntu-22.04
            targets: ''
          - os: macos-15
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned toolchain
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.targets }}
      # The runner label keeps caches from different images apart; must match
      # the shared-key in _desktop-build.yml.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release dependencies with the release feature set
        shell: bash
        working-directory: apps/desktop
        run: |
          # Tauri embeds this path. Cache only dependency crates: the real app
          # crate and frontend are rebuilt from the tagged source in release.
          mkdir -p ../web/.output/public
          echo '<!doctype html><title>cache producer</title>' > ../web/.output/public/index.html
          args=()
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(--target universal-apple-darwin)
          fi
          # Let the same Tauri CLI/config select deployment targets, features
          # and cargo environment as release packaging. Omit only frontend
          # generation and bundling/signing; no secrets are needed to warm crates.
          bunx tauri build --no-bundle "${args[@]}" \
            --config src-tauri/tauri.release.conf.json \
            --config '{"build":{"beforeBuildCommand":""}}' -- --locked
