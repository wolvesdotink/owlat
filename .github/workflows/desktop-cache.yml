name: Desktop release cache
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-cache.yml'
      - '.github/workflows/_desktop-build.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: desktop-release-cache
  cancel-in-progress: false
jobs:
  warm:
    name: Warm release dependencies (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: ''
          - os: ubuntu-22.04
            targets: ''
          - os: macos-14
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned toolchain
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release dependencies with the release feature set
        shell: bash
        run: |
          # Tauri embeds this path. Cache only dependency crates: the real app
          # crate and frontend are rebuilt from the tagged source in release.
          mkdir -p apps/web/.output/public
          echo '<!doctype html><title>cache producer</title>' > apps/web/.output/public/index.html
          if [ "$RUNNER_OS" = macOS ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml --target "$target"
            done
          else
            cargo build --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml
          fi
