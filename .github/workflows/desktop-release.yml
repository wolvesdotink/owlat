name: Desktop Release (single-target)

# DESKTOP-ONLY release for shipping a fix to the native apps without rebuilding
# the server images. Same reusable core as the unified `v*` pipeline.
#
#   git tag desktop-v0.2.1 && git push origin desktop-v0.2.1
#
# (For a release of everything together, push a plain `v*` tag — see release.yml.)
#
# Signing & notarization are SECRET-GATED: when the relevant repo secrets are
# absent (forks, PRs), the build still runs and produces unsigned artifacts.

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write # create the Release + upload artifacts
  id-token: write # OIDC for build provenance attestations
  attestations: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved desktop-only release VERSION=${VERSION}"

  # Same gate as the unified pipeline: a tag push does NOT match test.yml, so
  # without this job a desktop-v* tag on an un-CI'd commit would sign and
  # publish unverified artifacts. The whole pipeline is needs-chained below.
  verify:
    name: Verify (ci:verify)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      # ci:verify ends with the knip dead-code gate, which needs node on PATH
      # (setup-bun does not provide it) — mirrors release.yml's verify job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (lint + typecheck + test)
        run: bun run ci:verify
        env:
          TURBO_CONCURRENCY: "2"

  create-release:
    name: Create draft Release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - id: create
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "Owlat Desktop ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true # published by `publish` once the core succeeds
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Owlat Desktop v${{ needs.resolve.outputs.version }}

            Desktop-only release. Download the installer for your OS from the
            assets below (macOS `.dmg`, Windows `.msi`/`.exe`, Linux
            `.AppImage`/`.deb`). Existing installs auto-update to this version.

  desktop:
    name: Desktop apps
    needs: [resolve, create-release]
    uses: ./.github/workflows/_desktop-build.yml
    with:
      tag: ${{ github.ref_name }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  publish:
    name: Publish Release
    needs: [resolve, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - name: Publish (flip draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # This pipeline publishes a DESKTOP-ONLY asset set. It must never claim
          # the shared "latest" release — that is reserved for the unified v*
          # line, which consumers (the updater and install.sh) key off. Marking
          # a desktop-only release "latest" would hide the server/install assets.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest=false
          fi
          echo "Published $TAG (desktop apps only)."
