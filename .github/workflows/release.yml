name: Release (unified)

# UNIFIED release: one tag builds and publishes EVERYTHING onto a single GitHub
# Release — the server service images (GHCR) AND the desktop apps
# (macOS / Windows / Linux) + updater manifest.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Releases go through a candidate (docs/RELEASING.md): `bun run release:cut`
# tags `vX.Y.Z-rc.N`, which runs this whole pipeline (verification, both
# builds, the install gates and the update flow) and publishes a prerelease
# that no installer, updater or image alias follows. `bun run release:promote`
# then tags `vX.Y.Z` on that candidate's commit, and the `resolve` job refuses
# a stable tag anywhere else (scripts/ci/release-gate.ts).
#
# For a single-target fix release, use the dedicated pipelines instead:
#   git tag server-v0.2.1  && git push origin server-v0.2.1    # server images only
#   git tag desktop-v0.2.1 && git push origin desktop-v0.2.1    # desktop apps only
#
# Coordination: this workflow creates ONE draft Release, the reusable server and
# desktop cores upload their assets to it in parallel, then `publish` flips it
# live. The desktop app's version is stamped from the pushed tag automatically by
# the reusable desktop core (see `_desktop-build.yml` "Stamp release version from
# tag"), so Cargo.toml needs no manual bump before cutting a unified release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read # inspect exact-commit main verification
  contents: write # create the Release + upload assets
  packages: write # push images to GHCR
  id-token: write # OIDC for cosign keyless signing + attestations
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      # Full history and tags: a stable tag is checked against the candidate
      # tags on its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - id: meta
        name: Classify the tag and enforce the release policy
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bun scripts/ci/release-gate.ts

  # Gate the entire release on successful full CI of the EXACT tagged commit
  # (shared core: _verify.yml). test.yml only runs on branch push / PRs, which
  # a tag push does NOT match — without this job a tag on an un-CI'd commit
  # would sign and publish unverified artifacts. Everything downstream (draft
  # Release, server images, desktop apps, publish) is `needs`-chained to this,
  # so nothing ships unless the release commit is green.
  verify:
    name: Verify exact commit
    needs: resolve
    uses: ./.github/workflows/_verify.yml

  # Create ONE draft Release up front; both cores attach their assets to it.
  create-release:
    name: Create draft Release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      # The body leads with the version's curated CHANGELOG.md section (what
      # changed, then the Upgrading note) and ends with how to update. The
      # in-app update card renders the same body, so GitHub's generated PR
      # list is left off: the curated section already cites every PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Build release body
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO: ${{ github.repository }}
        run: bun scripts/release-body.ts "$VERSION" --repo "$REPO" > "$RUNNER_TEMP/release-body.md"
      - id: create
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: 'v${{ needs.resolve.outputs.version }}'
          tag_name: ${{ github.ref_name }}
          draft: true # published by the `publish` job once both cores succeed
          prerelease: ${{ needs.resolve.outputs.channel != 'stable' }}
          body_path: ${{ runner.temp }}/release-body.md

  server:
    name: Server images
    needs: [resolve, verify, create-release]
    uses: ./.github/workflows/_server-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ github.ref_name }}
    secrets: inherit

  desktop:
    name: Desktop apps
    needs: [resolve, verify, create-release]
    uses: ./.github/workflows/_desktop-build.yml
    with:
      tag: ${{ github.ref_name }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  publish:
    name: Publish Release
    needs: [resolve, server, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Publish (flip draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          # Only a stable release may become GitHub's "latest": install.sh, the
          # desktop updater's latest.json and the server's update check follow it.
          if [[ "$CHANNEL" != stable ]]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          fi
          echo "Published $TAG (server images + desktop apps)."

  promote-aliases:
    needs: [resolve, publish]
    if: needs.resolve.outputs.channel == 'stable'
    uses: ./.github/workflows/promote-aliases.yml

  # Candidates and prereleases too: a candidate is where an update that breaks
  # must show up, before the same commit is promoted. They start from the
  # stable release below their base version (scripts/ci/aliases.ts).
  update-versions:
    name: Resolve published update pair
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.pair.outputs.from }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/ci/resolve-update.ts

  post-publish-update:
    name: Verify the published update
    needs: [resolve, update-versions]
    if: needs.update-versions.outputs.from != ''
    uses: ./.github/workflows/update-flow.yml
    with:
      from: ${{ needs.update-versions.outputs.from }}
      to: ${{ needs.resolve.outputs.version }}
