name: Release (unified)

# UNIFIED release: one tag builds and publishes EVERYTHING onto a single GitHub
# Release — the server service images (GHCR) AND the desktop apps
# (macOS / Windows / Linux) + updater manifest.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# For a single-target fix release, use the dedicated pipelines instead:
#   git tag server-v0.2.1  && git push origin server-v0.2.1    # server images only
#   git tag desktop-v0.2.1 && git push origin desktop-v0.2.1    # desktop apps only
#
# Coordination: this workflow creates ONE draft Release, the reusable server and
# desktop cores upload their assets to it in parallel, then `publish` flips it
# live. The desktop app's version is stamped from the pushed tag automatically by
# the reusable desktop core (see `_desktop-build.yml` "Stamp release version from
# tag"), so Cargo.toml needs no manual bump before cutting a unified release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the Release + upload assets
  packages: write # push images to GHCR
  id-token: write # OIDC for cosign keyless signing + attestations
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved unified release VERSION=${VERSION}"

  # Gate the entire release on a green ci:verify of the EXACT tagged commit.
  # test.yml only runs on branch push / PRs, which a tag push does NOT match —
  # without this job a tag on an un-CI'd commit would sign and publish
  # unverified artifacts. Everything downstream (draft Release, server images,
  # desktop apps, publish) is `needs`-chained to this, so nothing ships unless
  # the release commit is green.
  verify:
    name: Verify (ci:verify)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      # ci:verify ends with the knip dead-code gate (scripts/check-dead-code.sh),
      # whose binary and JSON normaliser run on node; setup-bun does not put node
      # on PATH, so pin it explicitly (mirrors the lint job in test.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (lint + typecheck + test)
        # Unlike test.yml (one package per job), this job runs the WHOLE
        # monorepo's suites on a single 4-core runner. Turbo's default
        # concurrency (10) oversubscribes it badly enough that CPU-bound tests
        # ran 17-40x slower than idle and tripped their vitest deadlines (the
        # v0.4.0 gate died three times on three different tests this way). Cap
        # task concurrency so per-test wall time stays within the margins the
        # suites were sized for. 4 was not enough — each vitest task spawns its
        # own worker pool, so two CPU-bound suites side by side still starved
        # apps/api's heaviest tests past their deadlines (41s observed on a 10s
        # budget). 2 trades a few minutes of wall clock for a deterministic
        # gate.
        run: bun run ci:verify
        env:
          TURBO_CONCURRENCY: "2"

  # Create ONE draft Release up front; both cores attach their assets to it.
  create-release:
    name: Create draft Release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - id: create
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "v${{ needs.resolve.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: true # published by the `publish` job once both cores succeed
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Owlat v${{ needs.resolve.outputs.version }}

            ### Self-hosted server

            From the admin dashboard → **Settings → System & Updates** → "Update now", or:

            ```sh
            owlat upgrade --version ${{ needs.resolve.outputs.version }}
            ```

            Manual upgrade (fetch compose + SHA256, verify, apply):

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose-${{ needs.resolve.outputs.version }}.yml -o docker-compose.yml
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose-${{ needs.resolve.outputs.version }}.yml.sha256 -o docker-compose.yml.sha256
            sha256sum -c <(sed "s|docker-compose-${{ needs.resolve.outputs.version }}.yml|docker-compose.yml|" docker-compose.yml.sha256)
            docker compose pull && docker compose up -d
            docker compose --profile deploy run --rm convex-deploy
            ```

            ### Desktop app

            Download the installer for your OS from the assets below (macOS `.dmg`,
            Windows `.msi`/`.exe`, Linux `.AppImage`/`.deb`). Existing installs
            auto-update to this version.

            ### Supply-chain verification (recommended)

            ```sh
            cosign verify ghcr.io/${{ github.repository_owner }}/web:${{ needs.resolve.outputs.version }} \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            gh attestation verify docker-compose.yml --repo ${{ github.repository }}
            ```

            **Images:** `web`, `mta`, `updater`, `convex-deploy`, `imap`, `mail-sync`, `code-worker`, `setup` — all `ghcr.io/${{ github.repository_owner }}/<name>:${{ needs.resolve.outputs.version }}`

  server:
    name: Server images
    needs: [resolve, verify, create-release]
    uses: ./.github/workflows/_server-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ github.ref_name }}
    secrets: inherit

  desktop:
    name: Desktop apps
    needs: [resolve, verify, create-release]
    uses: ./.github/workflows/_desktop-build.yml
    with:
      tag: ${{ github.ref_name }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  publish:
    name: Publish Release
    needs: [resolve, server, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - name: Publish (flip draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          fi
          echo "Published $TAG (server images + desktop apps)."
