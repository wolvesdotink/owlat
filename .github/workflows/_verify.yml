name: _verify
# Every release gates on this exact SHA. Main already runs the stronger full
# graph; reuse only identified successful evidence, otherwise call that graph.
on:
  workflow_call: {}
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Find exact-commit main verification
    runs-on: ubuntu-latest
    # The 35-minute main wait also needs room for setup and bounded API retries.
    timeout-minutes: 50
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Check trusted full main CI and its artifact
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/reuse-main.ts
  fallback:
    name: Full verification fallback
    needs: probe
    if: needs.probe.outputs.reused != 'true'
    uses: ./.github/workflows/test.yml
  verify:
    name: Verify exact commit
    if: always()
    needs: [probe, fallback]
    runs-on: ubuntu-latest
    steps:
      - name: Require reused evidence or successful full fallback
        env:
          PROBE: ${{ needs.probe.result }}
          REUSED: ${{ needs.probe.outputs.reused }}
          FALLBACK: ${{ needs.fallback.result }}
        run: |
          test "$PROBE" = success
          if [ "$REUSED" = true ]; then
            test "$FALLBACK" = skipped
          else
            test "$FALLBACK" = success
          fi
