name: _verify

# Reusable CORE that gates a release on a green `ci:verify` of the exact ref
# it runs on. Shared by every release pipeline (release.yml, desktop-release.yml,
# server-release.yml): a tag push does NOT match test.yml, so without this gate a
# tag on an un-CI'd commit would sign and publish unverified artifacts. Each
# caller names its job `verify` and needs-chains everything downstream to it,
# so nothing ships unless the release commit is green.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (ci:verify)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      # ci:verify ends with the knip dead-code gate (scripts/check-dead-code.sh),
      # whose binary and JSON normaliser run on node; setup-bun does not put node
      # on PATH, so pin it explicitly (mirrors the lint job in test.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verify (lint + typecheck + test)
        # Unlike test.yml (one package per job), this job runs the WHOLE
        # monorepo's suites on a single 4-core runner. Turbo's default
        # concurrency (10) oversubscribes it badly enough that CPU-bound tests
        # ran 17-40x slower than idle and tripped their vitest deadlines (the
        # v0.4.0 gate died three times on three different tests this way). Cap
        # task concurrency so per-test wall time stays within the margins the
        # suites were sized for. 4 was not enough — each vitest task spawns its
        # own worker pool, so two CPU-bound suites side by side still starved
        # apps/api's heaviest tests past their deadlines (41s observed on a 10s
        # budget). 2 trades a few minutes of wall clock for a deterministic
        # gate.
        run: bun run ci:verify
        env:
          TURBO_CONCURRENCY: "2"
