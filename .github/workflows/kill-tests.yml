name: Kill tests

# SIGKILL the real MTA and mail-sync images in the middle of their work, start
# them again, and check what survived (scripts/kill-tests/run.ts): every queued
# send reaches exactly one terminal state with one body at the receiver, a send
# cut off after its body ends ambiguous and is never resent, and a backfill
# killed mid-batch still lands every message exactly once.
#
# A separate workflow rather than a Test Summary job: it builds two images and
# waits out GroupMQ's stalled-job recovery (minutes), so it runs on the pull
# requests that can change crash recovery, nightly, and on dispatch. Needs no
# secrets.

on:
  pull_request:
    paths:
      - 'apps/mta/**'
      - 'apps/mail-sync/**'
      - 'packages/email-scanner/**'
      - 'packages/mail-auth/**'
      - 'packages/mail-canon/**'
      - 'packages/mail-message/**'
      - 'packages/mta-protocol/**'
      - 'packages/shared/**'
      - 'packages/smtp-client/**'
      - 'packages/smtp-listener/**'
      - 'packages/worker-protocol/**'
      - 'patches/groupmq@*'
      - 'bun.lock'
      - 'scripts/kill-tests/**'
      - '.github/workflows/kill-tests.yml'
  schedule:
    - cron: '45 4 * * *' # nightly, after the update-flow run
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kill-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kill-tests:
    name: Kill tests (mta, mail-sync)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The orchestrator imports nothing outside scripts/kill-tests, so bun
      # alone is enough; the images install their own dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Kill and restart the MTA and mail-sync
        run: bun scripts/kill-tests/run.ts
