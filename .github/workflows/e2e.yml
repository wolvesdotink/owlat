name: E2E

# Playwright e2e runs nightly, on merges to main that touch the app or the
# backend, and on manual dispatch — NOT on every PR: it needs the CONVEX_TEST_*
# secrets and a full browser install, so it executes out-of-band where a
# failure can't block PR merges. The job FAILS when those secrets are missing:
# a nightly that reports green without running anything is not a gate. They are
# listed in CONTRIBUTING.md under "CI secrets".
#
# The job OWNS the test deployment for the length of a run: it wipes the data,
# pushes this commit's functions, and only then drives the browser. Nothing on
# that deployment survives a run, and two runs must never overlap — hence the
# constant concurrency group below.
on:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch: {}

concurrency:
  # Keyed on the DEPLOYMENT, not the ref: a dispatch from another branch shares
  # the one test backend with the nightly, where each run's reset deletes the
  # other's account and each run's push swaps the other's functions. Queue them.
  group: e2e-test-deployment
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check test deployment is configured
        env:
          CONVEX_TEST_URL: ${{ secrets.CONVEX_TEST_URL }}
          CONVEX_TEST_SITE_URL: ${{ secrets.CONVEX_TEST_SITE_URL }}
          CONVEX_TEST_ADMIN_KEY: ${{ secrets.CONVEX_TEST_ADMIN_KEY }}
          CONVEX_TEST_INSTANCE_SECRET: ${{ secrets.CONVEX_TEST_INSTANCE_SECRET }}
        run: |
          missing=""
          [ -n "$CONVEX_TEST_URL" ] || missing="$missing CONVEX_TEST_URL"
          [ -n "$CONVEX_TEST_SITE_URL" ] || missing="$missing CONVEX_TEST_SITE_URL"
          [ -n "$CONVEX_TEST_ADMIN_KEY" ] || missing="$missing CONVEX_TEST_ADMIN_KEY"
          [ -n "$CONVEX_TEST_INSTANCE_SECRET" ] || missing="$missing CONVEX_TEST_INSTANCE_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::E2E cannot run: repository secret(s) not set:$missing. Add them under Settings > Secrets and variables > Actions (see CONTRIBUTING.md, CI secrets)."
            exit 1
          fi

      - uses: ./.github/actions/setup-bun

      # @owlat/plugin-kit and @owlat/provider-kit (and the rest of the graph)
      # are consumed as built `dist/` entries through their package exports,
      # `dist/` is gitignored, and nothing in `bun install` builds them. Without
      # this both the function push (convex/lib/env.ts imports @owlat/plugin-kit,
      # so nearly every module pulls it in) and the Playwright dev server fail to
      # resolve them. The deploy image builds the same libraries first.
      - name: Build the workspace libraries the api and web import
        run: bunx turbo build --filter='@owlat/web^...'

      # Reset BEFORE the push, for two reasons. Registration is invite-only once
      # any account exists (convex/auth/registrationGate.ts) and the suite
      # registers a fresh account every run, so a second run against a used
      # instance would die on 403. And Convex validates existing documents
      # against the schema being pushed: with this repo's atomic-breaking-change
      # policy, last run's rows would fail the push itself. Wipe first, then push.
      #
      # NOTE: the non-tenant tables (lib/tenantTables.ts — keyVault,
      # warmingState, providerHealth, ...) survive the reset; a breaking change
      # to one of those still needs the deployment's volume recreated by hand.
      - name: Reset the test deployment to a blank slate
        env:
          CONVEX_TEST_SITE_URL: ${{ secrets.CONVEX_TEST_SITE_URL }}
          CONVEX_TEST_INSTANCE_SECRET: ${{ secrets.CONVEX_TEST_INSTANCE_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dev-reset.json -w '%{http_code}' -X POST \
            "${CONVEX_TEST_SITE_URL}/dev/reset" \
            -H "X-Instance-Secret: ${CONVEX_TEST_INSTANCE_SECRET}" --max-time 120)
          if [ "$code" != "200" ]; then
            echo "::error::/dev/reset returned HTTP ${code}: $(cat /tmp/dev-reset.json)"
            exit 1
          fi
          echo "Test deployment reset: $(cat /tmp/dev-reset.json)"

      # The suite drives the app built from THIS commit, so the backend it talks
      # to has to run this commit's functions too — otherwise a green run only
      # proves the app agrees with whatever was deployed last.
      #
      # `convex/**/__tests__` must not reach the push: the CLI treats every file
      # under convex/ as a function module and dies analysing the test helpers
      # ("import.meta unsupported"). The production deploy image excludes the
      # same paths at COPY time (docker/convex-deploy.Dockerfile); here the
      # checkout is throwaway, so delete them in place.
      - name: Deploy this commit's functions to the test deployment
        env:
          # Passed as env rather than --url/--admin-key so the key does not show
          # up in the runner's process list.
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_TEST_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_TEST_ADMIN_KEY }}
        run: |
          set -euo pipefail
          find apps/api/convex -type d -name __tests__ -prune -exec rm -rf {} +
          cd apps/api
          bunx convex deploy --yes

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install chromium --with-deps

      - name: Run E2E tests
        run: bun run --cwd apps/web test:e2e
        env:
          NUXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}
          NUXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.CONVEX_TEST_SITE_URL }}
          NUXT_PUBLIC_SITE_URL: http://localhost:3000
          # The setup project bootstraps its own owner through POST /seed/admin,
          # which is what a real instance does — self-registration is invite-only
          # and its page has no form without an invite link.
          CONVEX_TEST_INSTANCE_SECRET: ${{ secrets.CONVEX_TEST_INSTANCE_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
