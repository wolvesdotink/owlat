name: E2E

# Playwright e2e runs nightly, on merges to main that touch apps/web, and on
# manual dispatch — NOT on every PR: it needs the CONVEX_TEST_URL secrets and a
# full browser install, so it executes out-of-band where a failure can't block
# PR merges. The job FAILS when the test-deployment secrets are missing: a
# nightly that reports green without running anything is not a gate. The
# secrets are listed in CONTRIBUTING.md under "CI secrets". The push-to-main
# trigger surfaces web regressions within hours instead of waiting for the
# 04:00 UTC run.

on:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check test deployment is configured
        env:
          CONVEX_TEST_URL: ${{ secrets.CONVEX_TEST_URL }}
          CONVEX_TEST_SITE_URL: ${{ secrets.CONVEX_TEST_SITE_URL }}
        run: |
          missing=""
          [ -n "$CONVEX_TEST_URL" ] || missing="$missing CONVEX_TEST_URL"
          [ -n "$CONVEX_TEST_SITE_URL" ] || missing="$missing CONVEX_TEST_SITE_URL"
          if [ -n "$missing" ]; then
            echo "::error::E2E cannot run: repository secret(s) not set:$missing. Add them under Settings > Secrets and variables > Actions (see CONTRIBUTING.md, CI secrets)."
            exit 1
          fi

      - uses: ./.github/actions/setup-bun

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install chromium --with-deps

      - name: Run E2E tests
        run: bun run --cwd apps/web test:e2e
        env:
          NUXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}
          NUXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.CONVEX_TEST_SITE_URL }}
          NUXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
