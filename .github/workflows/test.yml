name: CI

# S10 / Phase 4.1: harden-runner gives us egress-audit + anomaly detection
# against a compromised action. Version tags (@v5, @v3, …) are kept current
# by Dependabot (.github/dependabot.yml, package-ecosystem: github-actions).
#
# Pull requests run only what they affect: the `detect` job asks Turborepo which
# workspaces changed *through the package graph* and feeds a dynamic matrix, so a
# docs-only PR runs one test job and one image build instead of all of them.
# Pushes, the nightly schedule and manual dispatch run the FULL set as a safety
# valve, so an affected-graph bug surfaces within a day rather than festering.

on:
  pull_request:
    branches: [main, 'integration/**', 'ux/**']
  push:
    branches: [main, 'integration/**']
  schedule:
    - cron: '0 5 * * *' # nightly full-matrix safety valve
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  # PR updates cancel stale work; main commits and nightly runs do not collide.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      web: ${{ steps.select.outputs.web }}
      mta: ${{ steps.select.outputs.mta }}
      expected: ${{ steps.select.outputs.expected }}
      full: ${{ steps.select.outputs.full }}
      api: ${{ steps.select.outputs.api }}
      images: ${{ steps.select.outputs.images }}
      java: ${{ steps.select.outputs.java }}
      desktopSpa: ${{ steps.select.outputs.desktopSpa }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --affected diffs HEAD against the PR base, so the base commit must
          # be present in the checkout.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Select affected work
        id: select
        env:
          # Anything that isn't a PR (push, schedule, dispatch) runs everything.
          RUN_ALL: ${{ github.event_name != 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-select-affected.sh

  test:
    name: Test group (${{ matrix.id }})
    needs: detect
    if: needs.detect.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.groups) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Turborepo remote cache
        if: github.ref_type != 'tag'
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Run grouped coverage suites
        id: coverage
        env:
          CI_GROUP: ${{ toJson(matrix) }}
          CI_FULL: ${{ needs.detect.outputs.full }}
        run: bun scripts/ci/run-group.ts
      - name: Upload coverage reports
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-group-${{ matrix.id }}
          path: ${{ steps.coverage.outputs.paths }}
          retention-days: 14

  test-mta:
    name: Test (mta)
    needs: detect
    if: needs.detect.outputs.mta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Turborepo remote cache
        if: github.ref_type != 'tag'
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Require Redis integration tests
        run: |
          docker pull redis:7-alpine
          echo "OWLAT_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"
      - name: Run MTA coverage
        run: bunx turbo run test:coverage --filter=@owlat/mta ${{ needs.detect.outputs.full == 'true' && '--force' || '' }}
      - name: Upload coverage
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-mta
          path: apps/mta/coverage/
          retention-days: 14

  test-api:
    name: Test api (shard ${{ matrix.shard }}/4)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Run coverage shard
        run: bun scripts/ci/run-shard.ts api ${{ matrix.shard }} 4
      - name: Upload identified blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            apps/api/.vitest-reports/*
            apps/api/.ci-shards/*
          include-hidden-files: true
          retention-days: 2

  test-api-merge:
    name: Test api (merge + coverage)
    needs: [detect, test-api]
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Download shard reports from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: apps/api/.ci-downloads
          pattern: api-blob-*
      - name: Validate identities, merge and enforce all coverage floors
        run: bun scripts/ci/merge-shards.ts api 4
      - name: Upload coverage
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-api
          path: apps/api/coverage/
          retention-days: 14

  test-web:
    name: Test web (shard ${{ matrix.shard }}/3)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Run coverage shard
        run: bun scripts/ci/run-shard.ts web ${{ matrix.shard }} 3
      - name: Upload identified blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            apps/web/.vitest-reports/*
            apps/web/.ci-shards/*
          include-hidden-files: true
          retention-days: 2

  test-web-merge:
    name: Test web (merge + coverage)
    needs: [detect, test-web]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Download shard reports from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: apps/web/.ci-downloads
          pattern: web-blob-*
      - name: Validate identities, merge and enforce all coverage floors
        run: bun scripts/ci/merge-shards.ts web 3
      - name: Upload coverage
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 14

  # The real-browser component tests (apps/web/vitest.browser.config.ts): what
  # happy-dom cannot show, such as a virtual list under real scrolling, a
  # modal's native Tab trap, or a picker placed from the caret's real box. Kept
  # out of the coverage shards because it needs Chrome, and selected whenever
  # the web suite is. A run takes well under a minute once Chrome is installed.
  test-web-browser:
    name: Test web (browser)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      # The project launches Playwright's `chrome` channel (the perf scenarios'
      # browser too), installed explicitly so the version is the current stable
      # release rather than whatever the runner image ships.
      - name: Install Google Chrome
        timeout-minutes: 10
        run: cd apps/web && bunx playwright install --with-deps chrome
      - name: Run the browser tests
        timeout-minutes: 10
        run: bun run --cwd apps/web test:browser

  # THE STANDALONE MATRIX (deliverability plan D2/D3). The ramp controller has two
  # gate implementations behind one interface: the concurrent reference-arm one,
  # and the trailing-baseline one a deployment with zero third-party accounts
  # runs. A deployment with no ESP is a SUPPORTED CONFIGURATION, so the whole gate
  # suite runs TWICE — once equipped, once with every external input removed — and
  # a regression that quietly makes a reference arm load-bearing fails the
  # standalone leg on the PR that introduces it rather than months later on the
  # install nobody runs by hand.
  #
  # THE MODE IS LOAD-BEARING, not decorative. `__tests__/gateFixtures.ts` reads it
  # and REFUSES to build a reference arm or a reference seed sweep in the
  # standalone leg, and the suites that measure against one declare themselves
  # (`describeEquipped` / `itEquipped`) and are skipped there. What runs in the
  # second leg is therefore the suite as a deployment with zero third-party
  # accounts experiences it — not the same fixtures with a few extra assertions.
  #
  # Deliberately NOT behind the affected-graph filter: it is a few hundred pure
  # unit tests with no database and no network, and the cost of running it always
  # is far below the cost of the degraded path rotting unnoticed.
  ramp-gate-matrix:
    name: Ramp gates (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [reference_arm, standalone]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      # apps/api/scripts/test-ramp.sh sets the sentinel + mode pair for the leg
      # it runs, so this job is the only place either variable is set. Every
      # other job leaves them unset and gets the equipped leg, including the
      # sharded test-api one, which runs these files too. `bun run test:ramp`
      # with no argument runs both legs locally.
      - name: Run the ramp gate suite (${{ matrix.mode }})
        run: bun run test:ramp ${{ matrix.mode }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A green run takes 5-8 minutes; a hung smoke or gate should fail the job
    # well before GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ci:lint (scripts/ci-gate.sh) includes the oxfmt format gate
          # (scripts/check-format.sh), which diffs changed JS/TS files against
          # the base branch. Full history is needed so
          # `git merge-base origin/<base> HEAD` resolves.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # ci:lint runs the knip dead-code gate (scripts/check-dead-code.sh), the
      # file-size ratchet (scripts/check-file-size.sh) and the Convex bundle
      # smoke. The dead-code gate's binary, its JSON normaliser and the smoke
      # all run on node, and setup-bun does not put node on PATH, so pin it
      # explicitly rather than rely on the runner image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Turborepo remote cache
        if: github.ref_type != 'tag'
        # Pinned to a commit SHA (not a mutable tag): this third-party action sits
        # in the trust path for test results — a poisoned turbo cache replays
        # "green" without running anything.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      # The plugin smokes (clean-checkout codegen, deploy graph, Convex
      # composition + function-graph bundles) run inside ci:lint; see
      # scripts/ci-gate.sh for the full ordered list.
      - name: Lint
        run: bun run ci:lint
        env:
          # scripts/check-stored-block-corpus.ts compares a push with the commit
          # its branch held before it (empty on other events) and other runs
          # with the default branch (main when the event carries no repository
          # metadata).
          STORED_BLOCK_CORPUS_PUSH_BEFORE: ${{ github.event.before }}
          STORED_BLOCK_CORPUS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Turborepo remote cache
        if: github.ref_type != 'tag'
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Typecheck workspaces and scripts
        run: bun run ci:typecheck

  docker-build:
    name: Docker Build (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Runtime-smoked images must be loaded into the local Docker daemon;
          # the remaining matrix entries can stay cache-only Buildx outputs.
          load: ${{ matrix.runtimeSmoke == true || matrix.cspShellSmoke == true }}
          tags: owlat-ci-${{ matrix.name }}:${{ github.sha }}
          # A real version, so the shell smoke can prove the image reports the
          # version it was built with. Ignored (with a warning) by the images
          # that declare no such ARG.
          build-args: |
            OWLAT_VERSION=0.0.0-ci
          cache-from: type=gha,scope=${{ matrix.name }}
          # Main owns reusable caches; PR/tag exports only churn quota.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

      # The entry chunk and its static imports are what every page, sign-in
      # included, loads before Vue mounts. The image above is the only place CI
      # runs `nuxt build`, so the budget reads that build: the renderer (which
      # names the entry) and the client chunks are copied out of the loaded
      # image (web sets cspShellSmoke, so `load` is on).
      - name: Set up bun for the bundle budget
        if: matrix.name == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # The same copy also feeds the test-code check: the server's traced
      # package.json and the client manifest must name no test package, test
      # route or vitest module (#1172).
      - name: Check the web entry bundle budget and test code
        if: matrix.name == 'web'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/web-output"
          mkdir -p "$out/server/chunks/routes" "$out/server/chunks/virtual" "$out/public"
          cid=$(docker create "owlat-ci-${{ matrix.name }}:${{ github.sha }}")
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/app/server/chunks/routes/renderer.mjs" "$out/server/chunks/routes/"
          docker cp "$cid:/app/server/chunks/virtual/precomputed.mjs" "$out/server/chunks/virtual/"
          docker cp "$cid:/app/server/package.json" "$out/server/"
          docker cp "$cid:/app/public/_nuxt" "$out/public/"
          bun scripts/check-bundle-budget.ts "$out"
          bun scripts/check-web-build-test-code.ts "$out"

      # Report-only (plan item OW-076): what each page and each lazily loaded
      # feature adds on top of the entry closure, read from the same copy. There
      # is no budget yet, so a change in these numbers never fails the job.
      - name: Report web route and deferred-feature closures
        if: matrix.name == 'web'
        continue-on-error: true
        run: bun scripts/report-bundle-closures.ts "$RUNNER_TEMP/web-output"

      - name: Smoke-test packaged Node runtime
        if: matrix.runtimeSmoke == true
        run: |
          docker run --rm --entrypoint node \
            "owlat-ci-${{ matrix.name }}:${{ github.sha }}" \
            --input-type=module -e "await import('./dist/index.js')"

      # The shell can answer 200 on every route and still be an app no browser
      # will run: its inline scripts are nonced, and if the CSP header does not
      # carry that nonce the mount dies on the first one. Every published web
      # image up to 0.4.5 shipped that way. Cheap enough for the PR gate, and it
      # runs against the real image rather than the config.
      - name: Smoke-test SPA shell CSP
        if: matrix.cspShellSmoke == true
        env:
          EXPECTED_VERSION: 0.0.0-ci
        run: bash scripts/check-web-csp-shell.sh "owlat-ci-${{ matrix.name }}:${{ github.sha }}"

  # E2E (Playwright) runs nightly + on manual dispatch in .github/workflows/e2e.yml
  # — out-of-band so a failure can't block PR merges. It does NOT skip on unset
  # secrets any more: the job fails and names them.

  # packages/sdk-java is outside the bun workspace, so turbo can't track it; the
  # detect job flags it from a Dockerfile-style path diff. Its JUnit suite never
  # ran in CI before this job.
  sdk-java:
    name: Test (packages/sdk-java)
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + test
        run: mvn -q --batch-mode --file packages/sdk-java/pom.xml verify

  # The real desktop frontend: the static `generate:desktop` build the Tauri app
  # packages (tauri.conf.json `build.frontendDist`). Desktop CI compiles the Rust
  # shell against a placeholder index.html, so this is the only PR-time build of
  # it; scripts/check-desktop-spa.ts fails on a referenced chunk, stylesheet,
  # font, icon or app manifest that was not emitted or does not match its
  # integrity hash. Selected when web is affected, when the bridge or Tauri config
  # changes (scripts/ci/selection.ts), and on every full run. The JS -> Rust
  # invoke-name contract needs no build and runs in Lint (lint:desktop-invoke).
  desktop-spa:
    name: Desktop SPA (build + inspect)
    needs: detect
    if: needs.detect.outputs.desktopSpa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: Turborepo remote cache
        if: github.ref_type != 'tag'
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # The same two steps the release build runs before tauri-action
      # (_desktop-build.yml): the web bundle imports some workspace libraries as
      # built dist/ entries, then tauri's beforeBuildCommand runs generate:desktop.
      - name: Build workspace libraries for the web bundle
        run: bunx turbo build --filter='@owlat/web^...'
      - name: Generate the desktop SPA
        run: bun run --cwd apps/web generate:desktop
      - name: Inspect the emitted SPA
        run: bun scripts/check-desktop-spa.ts

  # Single required status check. Skipped matrix jobs (a docs-only PR skips the
  # api shards, most images, etc.) don't count as failures — only real failures
  # or cancellations do. Point branch protection at THIS job, not the matrices.
  test-summary:
    name: Test Summary
    if: always()
    needs:
      [
        detect,
        test,
        test-mta,
        test-api,
        test-api-merge,
        test-web,
        test-web-merge,
        test-web-browser,
        ramp-gate-matrix,
        lint,
        typecheck,
        docker-build,
        sdk-java,
        desktop-spa,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Assert selected jobs succeeded and record verification
        env:
          CI_EXPECTED: ${{ needs.detect.outputs.expected }}
          CI_NEEDS: ${{ toJson(needs) }}
          CI_FULL: ${{ needs.detect.outputs.full }}
        run: bun scripts/ci/summary.ts
      - name: Upload full verification evidence
        if: needs.detect.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-verification
          path: .ci-verification/verification.json
          include-hidden-files: true
          overwrite: true
          retention-days: 7
