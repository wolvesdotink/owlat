name: CI

# S10 / Phase 4.1: harden-runner gives us egress-audit + anomaly detection
# against a compromised action. Version tags (@v5, @v3, …) are kept current
# by Dependabot (.github/dependabot.yml, package-ecosystem: github-actions).
#
# Pull requests run only what they affect: the `detect` job asks Turborepo which
# workspaces changed *through the package graph* and feeds a dynamic matrix, so a
# docs-only PR runs one test job and one image build instead of all of them.
# Pushes, the nightly schedule and manual dispatch run the FULL set as a safety
# valve, so an affected-graph bug surfaces within a day rather than festering.

on:
  pull_request:
    branches: [main, stage, pro, 'integration/**']
  push:
    branches: [main, stage, pro, 'integration/**']
  schedule:
    - cron: '0 5 * * *' # nightly full-matrix safety valve
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      api: ${{ steps.select.outputs.api }}
      images: ${{ steps.select.outputs.images }}
      java: ${{ steps.select.outputs.java }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --affected diffs HEAD against the PR base, so the base commit must
          # be present in the checkout.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Select affected work
        id: select
        env:
          # Anything that isn't a PR (push, schedule, dispatch) runs everything.
          RUN_ALL: ${{ github.event_name != 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-select-affected.sh

  test:
    name: Test (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.packages) }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.name == 'plugin-kit'
        with:
          node-version: '22'

      # Phase 3: share Turborepo results across CI runs via the GitHub Actions
      # cache, so a re-run / rebase-with-no-changes replays green suites in seconds.
      - name: Turborepo remote cache
        # Pinned to a commit SHA (not a mutable tag): this third-party action sits
        # in the trust path for test results — a poisoned turbo cache replays
        # "green" without running anything.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Run tests with coverage
        run: bunx turbo run test:coverage --filter=${{ matrix.package }}

      - name: Upload coverage report
        # Coverage thresholds are enforced during the run regardless; only keep
        # the artifacts from canonical branches to cut PR noise (Phase 4.4).
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.directory }}/coverage/
          retention-days: 14

  # apps/api is the long pole (3300+ tests). Shard it across 3 runners and merge
  # the blob reports for the combined coverage/threshold check (Phase 4.1). Runs
  # vitest directly rather than through turbo because sharding is per-invocation.
  test-api:
    name: Test api (shard ${{ matrix.shard }}/3)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - name: Run tests (shard ${{ matrix.shard }}/3)
        working-directory: apps/api
        # Collect coverage into the blob, but DON'T enforce the threshold here — a
        # single shard only exercises ~1/3 of the code and would always fall short.
        # The merge job checks the combined coverage against the real threshold.
        run: bunx vitest run --coverage --coverage.thresholds.lines=0 --reporter=blob --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-blob-${{ matrix.shard }}
          path: apps/api/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  test-api-merge:
    name: Test api (merge + coverage)
    needs: [detect, test-api]
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: apps/api/.vitest-reports
          pattern: api-blob-*
          merge-multiple: true

      - name: Merge reports + enforce coverage
        working-directory: apps/api
        run: bunx vitest --merge-reports --coverage

      - name: Upload coverage report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-api
          path: apps/api/coverage/
          retention-days: 14

  # THE STANDALONE MATRIX (deliverability plan D2/D3). The ramp controller has two
  # gate implementations behind one interface: the concurrent reference-arm one,
  # and the trailing-baseline one a deployment with zero third-party accounts
  # runs. A deployment with no ESP is a SUPPORTED CONFIGURATION, so the whole gate
  # suite runs TWICE — once equipped, once with every external input removed — and
  # a regression that quietly makes a reference arm load-bearing fails the
  # standalone leg on the PR that introduces it rather than months later on the
  # install nobody runs by hand.
  #
  # THE MODE IS LOAD-BEARING, not decorative. `__tests__/gateFixtures.ts` reads it
  # and REFUSES to build a reference arm or a reference seed sweep in the
  # standalone leg, and the suites that measure against one declare themselves
  # (`describeEquipped` / `itEquipped`) and are skipped there. What runs in the
  # second leg is therefore the suite as a deployment with zero third-party
  # accounts experiences it — not the same fixtures with a few extra assertions.
  #
  # Deliberately NOT behind the affected-graph filter: it is a few hundred pure
  # unit tests with no database and no network, and the cost of running it always
  # is far below the cost of the degraded path rotting unnoticed.
  ramp-gate-matrix:
    name: Ramp gates (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [reference_arm, standalone]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - name: Run the ramp gate suite (${{ matrix.mode }})
        working-directory: apps/api
        env:
          # The sentinel is this job's alone: it says "a matrix leg is running",
          # which is what lets the suite treat a MISSING mode as broken plumbing
          # rather than as the default. Every other job — the sharded test-api
          # one runs these files too — sets neither and gets the equipped leg.
          # Both must be set together or the leg silently collapses.
          OWLAT_RAMP_GATE_MATRIX: '1'
          OWLAT_RAMP_GATE_MATRIX_MODE: ${{ matrix.mode }}
        # `convex/delivery/signals` holds the registry the gate evaluators fold
        # (seams plan D9): the list of measurements and which arm evaluates each
        # moved there, so the standalone leg has to cover it or the degraded path
        # loses the half of the gate suite that says which gates it even runs.
        run: bunx vitest run convex/delivery/ramp convex/delivery/signals

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ci:lint ends with the oxfmt format gate (scripts/check-format.sh),
          # which diffs changed JS/TS files against the base branch. Full
          # history is needed so `git merge-base origin/<base> HEAD` resolves.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # ci:lint ends with the knip dead-code gate (scripts/check-dead-code.sh)
      # and the file-size ratchet (scripts/check-file-size.sh). The dead-code
      # gate's binary and JSON normaliser both run on node, and setup-bun does
      # not put node on PATH, so pin it explicitly rather than rely on the runner
      # image.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Turborepo remote cache
        # Pinned to a commit SHA (not a mutable tag): this third-party action sits
        # in the trust path for test results — a poisoned turbo cache replays
        # "green" without running anything.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Verify plugin codegen from clean artifacts
        run: bun run plugins:test-clean

      - name: Verify plugin deploy graph
        run: bun run plugins:test-deploy-graph

      - name: Verify Convex plugin composition bundle
        run: bun run plugins:test-convex-bundle

      # Bundles EVERY function module under apps/api/convex with Convex's real
      # isolate/node runtime split — the composition bundle above only covers
      # convex.config.ts, which is how the v0.4.2 runtime-boundary breakage
      # shipped unnoticed (#551).
      - name: Verify Convex function-graph bundle
        run: bun run plugins:test-convex-function-graph

      - name: Lint
        run: bun run ci:lint

      - name: Typecheck
        run: bun run ci:typecheck

  # apps/docs is part of the root ci:typecheck run above as well; this job runs
  # its Nuxt typecheck on its own. Its vitest suite runs through the affected
  # `test` matrix above.
  docs-typecheck:
    name: Typecheck (apps/docs)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run --cwd apps/docs typecheck

  docker-build:
    name: Docker Build (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Runtime-smoked images must be loaded into the local Docker daemon;
          # the remaining matrix entries can stay cache-only Buildx outputs.
          load: ${{ matrix.runtimeSmoke == true }}
          tags: owlat-ci-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-test packaged Node runtime
        if: matrix.runtimeSmoke == true
        run: |
          docker run --rm --entrypoint node \
            "owlat-ci-${{ matrix.name }}:${{ github.sha }}" \
            --input-type=module -e "await import('./dist/index.js')"

  # E2E (Playwright) runs nightly + on manual dispatch in .github/workflows/e2e.yml
  # — out-of-band so a failure or unset CONVEX_TEST_URL secret can't block PR merges.

  # packages/sdk-java is outside the bun workspace, so turbo can't track it; the
  # detect job flags it from a Dockerfile-style path diff. Its JUnit suite never
  # ran in CI before this job.
  sdk-java:
    name: Test (packages/sdk-java)
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + test
        run: mvn -q --batch-mode --file packages/sdk-java/pom.xml verify

  # Single required status check. Skipped matrix jobs (a docs-only PR skips the
  # api shards, most images, etc.) don't count as failures — only real failures
  # or cancellations do. Point branch protection at THIS job, not the matrices.
  test-summary:
    name: Test Summary
    if: always()
    needs:
      [
        detect,
        test,
        test-api,
        test-api-merge,
        ramp-gate-matrix,
        lint,
        docs-typecheck,
        docker-build,
        sdk-java,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJson(needs) }}'
          failed=$(echo '${{ toJson(needs) }}' \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not pass: $failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped."
