name: Reconcile release image aliases
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: read
  packages: write
# Never lock the entire publishing workflow. Retain queued callers so a newer
# reconciliation cannot cancel an already-published release's parent run.
concurrency:
  group: release-image-aliases
  cancel-in-progress: false
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency#example-queueing-multiple-pending-runs
  queue: max
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote immutable published digests under the lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/promote-aliases.ts
