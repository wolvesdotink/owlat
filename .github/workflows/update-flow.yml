name: Update flow

# A real in-app update, end to end (scripts/e2e-update-flow.sh): install the
# previous release, seed Convex data through it, and have the updater apply
# the next one. Two scenarios, each on its own runner:
#   - success: the published template; the stack has to land on it with the
#     seeded rows intact (scripts/e2e-update-flow-data.sh);
#   - rollback: the same template with web's healthcheck made to fail, so the
#     release deploys, starts and fails readiness; the updater has to roll it
#     back, and the stack has to be the previous release again, with the data
#     changed after the snapshot restored (scripts/e2e-update-flow-rollback.sh).
#
# Who performs the update:
#   - pull requests that touch the updater: the PR's updater image, in both
#     scenarios, so a change to the rollout is tested by a rollout;
#   - the release gate (_server-build.yml calls this before the draft release
#     is published), nightly and dispatch: the shipped updater of the previous
#     release for `success`, which is exactly what an operator clicking
#     "Update now" runs, and the target release's own updater for `rollback`,
#     since the previous one may predate rollback.
#
# Each run gets a Docker daemon of its own (scripts/e2e-update-flow-dind.sh):
# the updater prunes images and the harness takes its stack down with its
# volumes, so neither may touch the runner's daemon.
#
# Needs no secrets: the previous release comes from its public assets and
# GHCR, and a draft target is handed over as a run artifact by the caller.
on:
  pull_request:
    paths:
      - 'apps/updater/**'
      - 'packages/shared/src/containerHealth*'
      - 'scripts/e2e-update-flow*.sh'
      - '.github/workflows/update-flow.yml'
  # The release gate. Publication with GITHUB_TOKEN suppresses release events,
  # and a draft release has nothing to subscribe to, so the release pipeline
  # calls this workflow itself.
  workflow_call:
    inputs:
      from:
        type: string
        required: true
      to:
        type: string
        required: true
      target_artifact:
        description: >-
          Run artifact holding docker-compose-<to>.yml and its .sha256, which the
          caller downloaded from the draft release with its own credentials (a
          draft has no anonymous download URL). Empty: the published release.
        type: string
        required: false
        default: ''
  schedule:
    - cron: '30 4 * * *' # nightly 04:30 UTC, after the E2E run
  workflow_dispatch:
    inputs:
      from:
        description: 'Version to install first (default: the release before the latest)'
        required: false
      to:
        description: 'Version to update to (default: the latest release)'
        required: false

permissions:
  contents: read

concurrency:
  group: update-flow-${{ github.event_name }}-${{ inputs.to || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-flow:
    name: Update ${{ matrix.scenario }} (${{ github.event_name == 'pull_request' && 'this PR''s updater' || matrix.scenario == 'rollback' && 'target updater' || 'shipped updater' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, rollback]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          # Published, non-prerelease server releases (v*), newest first.
          mapfile -t releases < <(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 20 --json tagName \
            -q '.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))')
          TO="${TO:-${releases[0]}}"
          if [ -z "$FROM" ]; then
            for i in "${!releases[@]}"; do
              if [ "${releases[$i]}" = "v${TO#v}" ]; then FROM="${releases[$((i + 1))]:-}"; fi
            done
          fi
          if [ -z "$FROM" ] || [ -z "$TO" ]; then
            echo "::error::cannot resolve versions (from='$FROM' to='$TO')"
            exit 1
          fi
          echo "from=${FROM#v}" >> "$GITHUB_OUTPUT"
          echo "to=${TO#v}" >> "$GITHUB_OUTPUT"
          echo "Updating ${FROM#v} → ${TO#v}"

      # The release gate's target is a draft: its template comes from the
      # caller, already checked against the draft's checksum, and is checked
      # again before use. Never the published URL, which a draft does not have.
      - name: Download the release target
        if: inputs.target_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.target_artifact }}
          path: ${{ runner.temp }}/update-target

      # Two releases' images plus a Convex backend come to ~10 GB; a stock
      # runner has about 14 GB free, and the updater refuses to pull below 4.
      # They land in the dedicated daemon's volume, on this same disk. The
      # runner's own images are left alone: nothing here prunes the host.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          df -h /

      # As root inside the dedicated daemon's container, like a real install:
      # the updater runs with every capability dropped, so it can only write
      # an install directory root owns. A pair that cannot be tested fails
      # everywhere but on the nightly and dispatch runs (STRICT).
      - name: Run the update in a dedicated Docker daemon
        env:
          SCENARIO: ${{ matrix.scenario }}
          STRICT: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '1' || '0' }}
          BUILD_UPDATER: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          OWLAT_GIT_SHA: ${{ github.sha }}
          TEMPLATE_DIR: ${{ inputs.target_artifact && format('{0}/update-target', runner.temp) || '' }}
          DIND_NAME: owlat-update-flow-${{ matrix.scenario }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        run: bash scripts/e2e-update-flow-dind.sh "$FROM" "$TO"
