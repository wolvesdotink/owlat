name: Server Release (single-target)

# SERVER-ONLY release for shipping a fix to the backend service images without
# rebuilding the desktop apps. Same reusable core as the unified `v*` pipeline.
#
#   git tag server-v0.2.1 && git push origin server-v0.2.1
#
# (For a release of everything together, push a plain `v*` tag — see release.yml.)

on:
  push:
    tags:
      - 'server-v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved server-only release VERSION=${VERSION}"

  # Same gate as the unified pipeline: a tag push does NOT match test.yml, so
  # without this job a server-v* tag on an un-CI'd commit would build and
  # publish unverified images. The whole pipeline is needs-chained below.
  # Shared core: _verify.yml.
  verify:
    name: Verify (ci:verify)
    needs: resolve
    uses: ./.github/workflows/_verify.yml

  create-release:
    name: Create draft Release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "Server v${{ needs.resolve.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: true # published by `publish` once the core succeeds
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Owlat server v${{ needs.resolve.outputs.version }}

            Server-only release (Docker images + compose). Desktop apps unchanged.

            From the admin dashboard → **Settings → System & Updates** → "Update now", or:

            ```sh
            owlat upgrade --version ${{ needs.resolve.outputs.version }}
            ```

            **Images:** `web`, `mta`, `updater`, `convex-deploy`, `imap`, `mail-sync`, `code-worker`, `convex-fn-proxy`, `setup` — all `ghcr.io/${{ github.repository_owner }}/<name>:${{ needs.resolve.outputs.version }}`

  # `verify` is listed explicitly even though `create-release` already needs it:
  # the build/sign/publish edge is the one that must never lose the gate, and a
  # transitive-only dependency would vanish silently if the draft-Release step
  # were ever dropped or reordered. Keep it redundant — it is the actual gate.
  server:
    name: Server images
    needs: [resolve, verify, create-release]
    uses: ./.github/workflows/_server-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish Release
    needs: [resolve, server]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - name: Publish (flip draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # This pipeline publishes a SERVER-ONLY asset set. It must never claim
          # the shared "latest" release — that is reserved for the unified v*
          # line, which consumers (the updater and install.sh) key off. Marking
          # a server-only release "latest" would hide the desktop/install assets.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest=false
          fi
          echo "Published $TAG (server images only)."
